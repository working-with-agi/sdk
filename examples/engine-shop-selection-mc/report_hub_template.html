<title>エンジン整備レポート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">
<style>
:root {
  --ground: #eef2f5; --surface: #ffffff; --ink: #13202c; --muted: #5b6a78; --rule: #d3dbe3;
  --accent: #274c77; --accent-soft: #dde7f2;
  --good: #2c7a4b; --good-soft: #dcefe3; --warn: #a8671a; --warn-soft: #f6e8d3; --crit: #b0362d; --crit-soft: #f6dcd9;
  --ws-pr: #3d8fb8; --ws-core: #d08a2e; --ws-full: #7a5aa8;
  --peak: rgba(168, 103, 26, .10);
  --shadow: 0 1px 2px rgba(19, 32, 44, .06), 0 4px 16px rgba(19, 32, 44, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e141a; --surface: #161f28; --ink: #e3e9ef; --muted: #93a3b3; --rule: #2a3642;
    --accent: #7fb0e6; --accent-soft: #1d2d3f; --good: #5cc28a; --good-soft: #173326;
    --warn: #e0a257; --warn-soft: #3a2a16; --crit: #ef7c70; --crit-soft: #3c1d1a;
    --ws-pr: #6cb8de; --ws-core: #eba857; --ws-full: #a88be0; --peak: rgba(224, 162, 87, .10); --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e141a; --surface: #161f28; --ink: #e3e9ef; --muted: #93a3b3; --rule: #2a3642;
  --accent: #7fb0e6; --accent-soft: #1d2d3f; --good: #5cc28a; --good-soft: #173326;
  --warn: #e0a257; --warn-soft: #3a2a16; --crit: #ef7c70; --crit-soft: #3c1d1a;
  --ws-pr: #6cb8de; --ws-core: #eba857; --ws-full: #a88be0; --peak: rgba(224, 162, 87, .10); --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 14px/1.65 "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 48px; display: grid; gap: 18px; }
.mono, .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
h1 { font-size: 24px; margin: 0; line-height: 1.35; text-wrap: balance; }
h2 { font-size: 15px; margin: 0; }
p { margin: 0; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
.hint { color: var(--muted); font-size: 12px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.tabs button { font: inherit; font-size: 13px; padding: 8px 14px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { display: grid; gap: 2px; }
.kpi .label { font-size: 11px; color: var(--muted); }
.kpi .value { font-size: 22px; font-weight: 500; }
.kpi .sub { font-size: 11px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; margin-top: 4px; }
.meter > span { display: block; height: 100%; background: var(--accent); }
.meter > span.hot { background: var(--warn); } .meter > span.over { background: var(--crit); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 10px; }
svg .axis { stroke: var(--rule); }
svg .grid { stroke: var(--rule); stroke-dasharray: 2 4; }
svg .peak { fill: var(--peak); }
svg .pr { fill: var(--ws-pr); } svg .core { fill: var(--ws-core); } svg .full { fill: var(--ws-full); }
svg .spend { fill: none; stroke: var(--ink); stroke-width: 1.5; }
svg .spend-dot { fill: var(--ink); }
svg .req { fill: var(--accent-soft); } svg .buf { fill: var(--warn-soft); }
svg .have { fill: none; stroke: var(--accent); stroke-width: 2; }
svg .aging { fill: none; stroke: var(--crit); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg .win { fill: var(--accent-soft); }
svg .band { fill: var(--muted); opacity: .16; }
svg .norm { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 3; }
svg .plan { fill: var(--accent); }
svg .plan.sel { fill: var(--ink); }
svg .fi { font-size: 9px; fill: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 560px; }
th { text-align: left; font-weight: 500; font-size: 11px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--rule); }
th.n, td.n { text-align: right; }
tr.best td { background: var(--accent-soft); }
.ws { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 4px; color: #fff; }
.ws.PR { background: var(--ws-pr); } .ws.CORE { background: var(--ws-core); } .ws.FULL { background: var(--ws-full); }
.btn { font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--rule); }
.btn:disabled { opacity: .5; cursor: default; }
.ai-out { white-space: pre-wrap; font-size: 13px; background: var(--ground); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; min-height: 44px; }
.controls { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.controls label { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
select { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); }
input[type=range] { width: min(420px, 60vw); accent-color: var(--accent); }
.asof { font-family: "IBM Plex Mono", monospace; font-size: 15px; font-weight: 500; color: var(--ink); }
.verdict { display: grid; gap: 10px; }
.line { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.line:last-child { border-bottom: 0; padding-bottom: 0; }
.line .q { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.line .a { font-size: 16px; font-weight: 600; line-height: 1.5; }
.line .why { font-size: 12px; color: var(--muted); font-weight: 400; display: block; margin-top: 2px; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 9px; margin-right: 6px; vertical-align: 2px; }
.pill.go { background: var(--good-soft); color: var(--good); } .pill.act { background: var(--crit-soft); color: var(--crit); } .pill.mid { background: var(--warn-soft); color: var(--warn); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.sev { font-size: 11px; font-weight: 600; } .sev.crit { color: var(--crit); } .sev.warn { color: var(--warn); }
.pos { color: var(--good); } .neg { color: var(--crit); }
details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.close { color: var(--good); font-weight: 600; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } .line { grid-template-columns: 1fr; gap: 2px; } }
</style>
<style>
.crumb { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.crumb button { font: inherit; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.crumb span.cur { color: var(--ink); font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.card { font: inherit; text-align: left; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; cursor: pointer; box-shadow: var(--shadow); }
.card:hover { border-color: var(--accent); }
.card .lv { font-size: 10px; letter-spacing: .1em; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
.card h3 { margin: 0; font-size: 15px; }
.card .c { font-size: 13px; line-height: 1.55; }
.card .nums { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.card .nums b { font-family: "IBM Plex Mono", monospace; font-size: 15px; color: var(--ink); font-weight: 500; margin-right: 3px; }
.card .more { font-size: 12px; color: var(--accent); }
.card.flag { border-left: 4px solid var(--crit); } .card.warn { border-left: 4px solid var(--warn); } .card.ok { border-left: 4px solid var(--good); }
.levels { display: flex; gap: 6px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.levels span { border: 1px solid var(--rule); border-radius: 999px; padding: 1px 8px; }
.levels span.on { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.bar { height: 8px; background: var(--accent-soft); border-radius: 4px; position: relative; min-width: 80px; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }
.bar > i.over { background: var(--crit); } .bar > i.hot { background: var(--warn); }
.src { font-size: 12px; word-break: break-all; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips span { font-size: 12px; border: 1px solid var(--rule); border-radius: 6px; padding: 1px 8px; font-family: "IBM Plex Mono", monospace; }
.panel > .guide { order: 9; } .panel > p.hint { order: 10; }
.guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 16px; background: var(--ground); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 1.6; }
.guide b { display: block; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; margin-bottom: 1px; }
.guide .say { color: var(--ink); font-weight: 600; }
</style>
<style>
.chart-note { font-size: 13px; font-weight: 600; margin: 0; }
svg .lbl { font-size: 11px; fill: var(--ink); font-family: "IBM Plex Sans JP", system-ui, sans-serif; }
svg .tick { font-size: 9px; }
.vgrid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 900px) { .vgrid { grid-template-columns: 1fr; } }
.card svg { margin-top: 2px; }
</style>

<main class="wrap">
  <header style="display:grid;gap:8px">
    <span class="eyebrow">737-800 engine plan · report</span>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <h1 id="title">エンジン整備レポート</h1>
      <div class="tabs" role="tablist" id="cos" aria-label="会社" style="border:0"></div>
    </div>
    <nav class="crumb" id="crumb" aria-label="現在の位置"></nav>
    <div class="levels" id="levels"></div>
  </header>
  <div id="view" style="display:grid;gap:18px"></div>
  <p class="hint">数字は公開情報からの推定による合成データです。出典のない数字は「前提と出典」に一覧があります。</p>
</main>
<script>
const DATA = /*__DATA__*/null;
(function () {
  const $ = (id) => document.getElementById(id);
  const fmt = (v) => Math.round(v).toLocaleString("en-US");
  const musd = (k) => (k / 1000).toFixed(1);
  const pct = (v, d = 0) => (v * 100).toFixed(d) + "%";
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const WS = { PR: "var(--ws-pr)", CORE: "var(--ws-core)", FULL: "var(--ws-full)" };
  const WORLD = ["var(--accent)", "var(--warn)", "var(--crit)", "var(--ws-full)"];
  let co = 0, path = ["summary"], role = "all";
  const ROLES = { all: "すべて", exec: "経営", fin: "財務", ops: "運航", plan: "整備計画", proc: "調達・契約", tech: "技術・品質" };
  const CARD_ROLES = {
    budget: ["exec", "fin", "plan"], month: ["ops", "plan"], track: ["exec", "plan"], actions: ["exec", "fin", "proc"],
    invest: ["exec", "proc", "fin"], history: ["exec", "plan", "tech"], horizon: ["exec"], sources: ["tech"],
    quote: ["plan", "tech", "fin"], trend: ["tech", "plan", "ops"], spares: ["ops", "plan", "exec"], offer: ["proc", "fin"],
    cash: ["fin", "exec"], reliability: ["tech", "exec"], roll: ["exec", "plan", "fin"],
  };
  const VIEWS = {
    summary: { label: "経営サマリー", level: 1 },
    budget: { label: "年間計画と予算", level: 2 }, month: { label: "今月からの判断", level: 2 },
    track: { label: "計画の追跡", level: 2 }, actions: { label: "打ち手の効果", level: 2 },
    invest: { label: "国内工場の新設", level: 2 }, sources: { label: "前提と出典", level: 4 },
    engines: { label: "エンジン別の明細", level: 3 },
    history: { label: "過去の計画との整合", level: 2 }, horizon: { label: "時間軸のつながり", level: 2 },
    roll: { label: "次の版への引き継ぎ", level: 2 }, quote: { label: "見積もりの承認", level: 2 }, trend: { label: "状態監視の警報", level: 2 }, spares: { label: "予備エンジンの数", level: 2 },
    offer: { label: "エンジンの打診", level: 2 }, cash: { label: "支払いと為替", level: 2 }, reliability: { label: "信頼性管理", level: 2 },
  };
  DATA.forEach((c, i) => { const b = document.createElement("button"); b.type = "button"; b.role = "tab"; b.textContent = c.name; b.onclick = () => { co = i; render(); }; $("cos").append(b); });
  const go = (...p) => { path = p; render(); window.scrollTo(0, 0); };
  const C = () => DATA[co];

  function render() {
    [...$("cos").children].forEach((b, i) => b.setAttribute("aria-selected", String(i === co)));
    const v = path[path.length - 1];
    $("crumb").innerHTML = path.map((p, i) => i === path.length - 1 ? `<span class="cur">${VIEWS[p].label}</span>` : `<button type="button" data-i="${i}">${VIEWS[p].label}</button> ›`).join(" ");
    $("crumb").querySelectorAll("button").forEach((b) => (b.onclick = () => go(...path.slice(0, +b.dataset.i + 1))));
    $("levels").innerHTML = ["1 結論", "2 ユースケース", "3 明細", "4 前提と出典"].map((l, i) => `<span class="${VIEWS[v].level === i + 1 ? "on" : ""}">${l}</span>`).join("");
    $("title").textContent = `エンジン整備レポート：${C().name}`;
    $("view").innerHTML = ({ summary, budget, month, track, actions, invest, sources, engines, history, horizon, quote, trend, spares, offer, cash, reliability, roll })[v]();
    $("view").querySelectorAll("[data-role]").forEach((el) => (el.onclick = () => { role = el.dataset.role; render(); }));
    $("view").querySelectorAll("[data-go]").forEach((el) => (el.onclick = () => go(...path, el.dataset.go)));
  }
  const panel = (title, inner, note) => `<section class="panel">${title ? `<h2>${title}</h2>` : ""}${inner}${note ? `<p class="hint">${note}</p>` : ""}</section>`;
  const card = (key, cls, title, concl, svg) => `<button type="button" class="card ${cls}" data-go="${key}"><span class="lv">LEVEL ${VIEWS[key].level}</span><h3>${title}</h3><span class="c">${concl}</span>${svg || ""}<span class="more">詳しく →</span></button>`;

  /* ---------------- charts ---------------- */
  // the month map: one row per question, one cell per month, colour = how it looks
  function monthMap(c, W = 900) {
    const m = c.months, n = m.length, L = 96, R = 8, T = 18, rowH = 22, rows = 4, H = T + rows * rowH + 20, cw = (W - L - R) / n;
    const x = (i) => L + i * cw;
    const colour = {
      margin: (r) => (r.margin < 0 ? "var(--crit)" : r.margin <= 2 ? "var(--warn)" : r.margin <= 5 ? "var(--accent-soft)" : "var(--good-soft)"),
      load: (r) => { const u = r.load / r.slots; return u > 0.9 ? "var(--crit)" : u > 0.7 ? "var(--warn)" : u < 0.5 ? "var(--ground)" : "var(--accent-soft)"; },
      ind: (r) => (r.inductions > r.norm_visits * 1.8 ? "var(--ws-full)" : r.inductions > r.norm_visits * 1.2 ? "var(--ws-core)" : r.inductions ? "var(--ws-pr)" : "var(--ground)"),
    };
    const rowsDef = [["余力", "margin", (r) => `余力 ${r.margin >= 0 ? "+" : ""}${r.margin} 基`], ["工場の混み具合", "load", (r) => `工場 ${r.load}/${r.slots}`], ["入場（平年比）", "ind", (r) => `入場 ${r.inductions} 件・平年 ${r.norm_visits.toFixed(1)}`]];
    let s = "";
    m.forEach((r, i) => { if (r.peak) s += `<rect x="${x(i)}" y="${T - 4}" width="${cw}" height="${rows * rowH + 4}" fill="var(--peak)"/>`; });
    rowsDef.forEach(([label, key, tip], j) => {
      const y = T + j * rowH;
      s += `<text class="lbl" x="${L - 8}" y="${y + rowH / 2 + 4}" text-anchor="end">${label}</text>`;
      m.forEach((r, i) => { s += `<rect x="${x(i) + 1}" y="${y + 2}" width="${cw - 2}" height="${rowH - 4}" rx="3" fill="${colour[key](r)}"><title>${r.label} ${tip(r)}</title></rect>`; });
    });
    const y = T + 3 * rowH;
    s += `<text class="lbl" x="${L - 8}" y="${y + rowH / 2 + 4}" text-anchor="end">判断期限</text>`;
    m.forEach((r, i) => { if (r.due) s += `<circle cx="${x(i) + cw / 2}" cy="${y + rowH / 2}" r="${Math.min(9, 3 + r.due * 1.5)}" fill="var(--crit)" opacity=".8"><title>${r.label} 判断期限 ${r.due} 件</title></circle>`; });
    m.forEach((r, i) => { if (i % 3 === 0) s += `<text class="tick" x="${x(i) + cw / 2}" y="${H - 4}" text-anchor="middle">${r.label.slice(2)}</text>`; });
    s += `<text class="tick" x="${L}" y="10">色付きの列＝繁忙期</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="24 か月の地図">${s}</svg>`;
  }
  const legendMap = `<div class="legend"><span><span class="sw" style="background:var(--good-soft)"></span>余裕あり</span><span><span class="sw" style="background:var(--warn)"></span>薄い／込み気味</span><span><span class="sw" style="background:var(--crit)"></span>足りない／詰まり</span><span><span class="sw" style="background:var(--ws-full)"></span>入場が平年の倍近い</span><span><span class="sw" style="background:var(--crit);border-radius:50%"></span>判断期限（大きいほど件数が多い）</span></div>`;

  // fiscal years: bar = plan, red tick = budget, grey tick = normal year
  function fyBars(c, W = 560, compact = false) {
    const f = c.fiscal_years, L = 70, R = 14, rowH = compact ? 22 : 34, H = f.length * rowH + 8;
    const top = Math.max(...f.map((r) => Math.max(r.spend, r.budget, r.norm))) * 1.05, x = (v) => L + v / top * (W - L - R);
    let s = "";
    f.forEach((r, i) => {
      const y = 4 + i * rowH, h = rowH - (compact ? 8 : 14);
      s += `<text class="lbl" x="${L - 8}" y="${y + h / 2 + 4}" text-anchor="end">${r.fy}</text>`;
      s += `<rect x="${L}" y="${y}" width="${x(r.spend) - L}" height="${h}" rx="3" fill="${r.spend > r.budget * 1.05 ? "var(--crit)" : r.spend > r.budget ? "var(--warn)" : "var(--accent)"}"><title>${r.fy} 計画 ${musd(r.spend)} 百万ドル・予算 ${musd(r.budget)}（${r.months} か月）</title></rect>`;
      s += `<line x1="${x(r.budget)}" x2="${x(r.budget)}" y1="${y - 3}" y2="${y + h + 3}" stroke="var(--ink)" stroke-width="2"/>`;
      if (!compact) s += `<text class="tick" x="${x(Math.max(r.spend, r.budget)) + 6}" y="${y + h / 2 + 3}">${r.over > 0 ? "+" : ""}${Math.round(r.over * 100)}%</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="年度ごとの整備費と予算">${s}</svg>`;
  }

  // actions: x = change in cost, y = change in risk; lower-left is good. Both axes are
  // compressed at the ends (asinh) so a -170 M$ part-out does not flatten everything else.
  function scatter(c, W = 560, H = 300, compact = false) {
    const a = c.actions, L = compact ? 8 : 48, R = compact ? 8 : 150, T = 14, B = compact ? 8 : 34;
    const fx = (v) => Math.asinh(v / 3), fy = (v) => Math.asinh(v / 0.5);   // 3 M$ and 0.5 pt are "linear" below
    const xs = a.map((r) => fx(r.cost / 1000)), ys = a.map((r) => fy(r.aog * 100));
    const x0 = Math.min(fx(-10), ...xs) * 1.08, x1 = Math.max(fx(10), ...xs) * 1.08, y0 = Math.min(fy(-2), ...ys) * 1.1, y1 = Math.max(fy(2), ...ys) * 1.1;
    const X = (v) => L + (fx(v) - x0) / (x1 - x0) * (W - L - R), Y = (v) => T + (y1 - fy(v)) / (y1 - y0) * (H - T - B);
    let s = `<rect x="${L}" y="${Y(0)}" width="${X(0) - L}" height="${H - B - Y(0)}" fill="var(--good-soft)"/><rect x="${X(0)}" y="${T}" width="${W - R - X(0)}" height="${Y(0) - T}" fill="var(--crit-soft)"/>`;
    s += `<line x1="${X(0)}" x2="${X(0)}" y1="${T}" y2="${H - B}" stroke="var(--muted)"/><line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)"/>`;
    if (!compact) {
      [-100, -30, -10, -3, 3, 10].forEach((v) => { if (fx(v) > x0 && fx(v) < x1) s += `<line x1="${X(v)}" x2="${X(v)}" y1="${H - B}" y2="${H - B + 4}" stroke="var(--muted)"/><text class="tick" x="${X(v)}" y="${H - B + 14}" text-anchor="middle">${v > 0 ? "+" : ""}${v}</text>`; });
      [-2, -1, 1, 5, 15].forEach((v) => { if (fy(v) > y0 && fy(v) < y1) s += `<text class="tick" x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${v > 0 ? "+" : ""}${v}</text>`; });
      s += `<text class="tick" x="${L + 6}" y="${H - B - 6}">安くて安全</text><text class="tick" x="${W - R - 6}" y="${T + 12}" text-anchor="end">高くて危ない</text>`;
      s += `<text class="tick" x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">費用の増減（百万ドル、両端は圧縮）</text><text class="tick" x="12" y="${(T + H - B) / 2}" transform="rotate(-90 12 ${(T + H - B) / 2})" text-anchor="middle">欠航リスク（pt）</text>`;
    }
    const placed = [];
    [...a].sort((p, q) => p.aog - q.aog).forEach((r, k) => {
      const cx = X(r.cost / 1000), cy = Y(r.aog * 100);
      s += `<circle cx="${cx}" cy="${cy}" r="${compact ? 3.5 : 5.5}" fill="${r.cost < 0 && r.aog <= 0.001 ? "var(--good)" : r.aog > 0.01 ? "var(--crit)" : "var(--accent)"}"><title>${esc(r.question)}：${r.cost > 0 ? "+" : ""}${musd(r.cost)} 百万ドル、欠航 ${r.aog > 0 ? "+" : ""}${(r.aog * 100).toFixed(1)}pt</title></circle>`;
      if (compact) return;
      let ly = cy + 4;
      while (placed.some((p) => Math.abs(p.y - ly) < 12 && Math.abs(p.x - cx) < 170)) ly += 12;
      placed.push({ x: cx, y: ly });
      const short = r.question.replace(/（.*?）/g, "").replace(/したら$|たら$|なら$/, "");
      s += `${Math.abs(ly - cy - 4) > 1 ? `<line x1="${cx + 5}" y1="${cy}" x2="${cx + 10}" y2="${ly - 4}" stroke="var(--muted)"/>` : ""}<text class="tick" x="${cx + 10}" y="${ly}">${esc(short)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="打ち手の費用とリスク">${s}</svg>`;
  }

  // tracking: world probability over time (stacked) and the value of switching
  function trackChart(t, W = 560, H = 190, compact = false) {
    const S = t.series, n = S.length, L = compact ? 6 : 34, R = 6, T = 8, B = compact ? 6 : 24, labels = t.world_labels;
    const x = (i) => L + i / Math.max(1, n - 1) * (W - L - R), y = (v) => T + (1 - v) * (H - T - B);
    let s = "", lo = S.map(() => 0);
    labels.forEach((w, j) => {
      const hi = S.map((p, i) => lo[i] + (p.posterior[w] || 0));
      s += `<polygon fill="${WORLD[j]}" opacity=".8" points="${hi.map((v, i) => `${x(i)},${y(v)}`).join(" ")} ${lo.map((v, i) => `${x(i)},${y(v)}`).reverse().join(" ")}"><title>${esc(w)}</title></polygon>`;
      lo = hi;
    });
    if (!compact) S.forEach((p, i) => { if (i % 3 === 0) s += `<text class="tick" x="${x(i)}" y="${H - 6}" text-anchor="middle">${p.as_of.slice(2)}</text>`; });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="前提の確率の推移">${s}</svg>`;
  }
  const worldLegend = (t) => `<div class="legend">${t.world_labels.map((w, j) => `<span><span class="sw" style="background:${WORLD[j]}"></span>${esc(w)}</span>`).join("")}</div>`;

  function switchChart(t, W = 560, H = 170) {
    const S = t.series, n = S.length, L = 44, R = 8, T = 12, B = 24, vals = S.map((p) => p.best_saving);
    const hi = Math.max(600, ...vals), lo = Math.max(-3000, Math.min(-300, ...vals));
    const x = (i) => L + i / Math.max(1, n - 1) * (W - L - R), y = (v) => T + (hi - Math.max(lo, Math.min(hi, v))) / (hi - lo) * (H - T - B);
    let s = `<rect x="${L}" y="${y(300)}" width="${W - L - R}" height="${y(0) - y(300)}" fill="var(--warn-soft)"/><line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--rule)"/>`;
    s += `<text class="tick" x="${L - 4}" y="${y(300) + 3}" text-anchor="end">+0.3</text><text class="tick" x="${L - 4}" y="${y(0) + 3}" text-anchor="end">0</text>`;
    s += `<polyline fill="none" stroke="var(--ink)" stroke-width="2" points="${vals.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>`;
    S.forEach((p, i) => { if (i % 3 === 0) s += `<text class="tick" x="${x(i)}" y="${H - 6}" text-anchor="middle">${p.as_of.slice(2)}</text>`; });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="乗り換えの価値の推移">${s}</svg>`;
  }

  // outlook: visits per year, stacked by workscope
  function outlookChart(c, W = 560, H = 200) {
    const O = c.outlook.filter((y) => y.year >= 0), n = O.length, L = 30, R = 8, T = 10, B = 24, bw = (W - L - R) / n;
    const top = Math.max(...O.map((y) => y.visits)) * 1.1, y = (v) => H - B - v / top * (H - T - B);
    let s = "";
    O.forEach((yr, i) => {
      let acc = 0;
      ["PR", "CORE", "FULL"].forEach((w) => { const v = yr.by_ws[w] || 0; if (!v) return; s += `<rect x="${L + i * bw + 4}" y="${y(acc + v)}" width="${bw - 8}" height="${y(acc) - y(acc + v)}" fill="${WS[w]}"><title>${yr.year === 0 ? "今年" : "+" + yr.year + " 年"} ${w} ${v} 件</title></rect>`; acc += v; });
      s += `<text class="tick" x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${yr.year === 0 ? "今年" : "+" + yr.year}</text>`;
    });
    s += `<line x1="${L}" x2="${W - R}" y1="${y(c.norms.visits_per_year)}" y2="${y(c.norms.visits_per_year)}" stroke="var(--ink)" stroke-dasharray="4 3"><title>平年 ${c.norms.visits_per_year.toFixed(1)} 件</title></line>`;
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="10 年の入場件数">${s}</svg>`;
  }
  const wsLegend = `<div class="legend"><span><span class="sw" style="background:var(--ws-pr)"></span>性能回復（PR）</span><span><span class="sw" style="background:var(--ws-core)"></span>コア＋寿命部品（CORE）</span><span><span class="sw" style="background:var(--ws-full)"></span>全面（FULL）</span></div>`;

  // engines: one row each -- window to remove, time off wing, decision marker
  function gantt(c, W = 1100) {
    const P = [...c.plan].sort((a, b) => a.t - b.t || a.limit_t - b.limit_t), n = c.months.length;
    const L = 64, R = 10, T = 22, rowH = 14, H = T + P.length * rowH + 20, cw = (W - L - R) / n, x = (t) => L + Math.max(0, Math.min(n, t)) * cw;
    let s = "";
    c.months.forEach((m, i) => { if (m.peak) s += `<rect x="${x(i)}" y="${T - 4}" width="${cw}" height="${P.length * rowH + 4}" fill="var(--peak)"/>`; if (i % 3 === 0) s += `<text class="tick" x="${x(i) + 2}" y="${T - 8}">${m.label.slice(2)}</text>`; });
    P.forEach((r, j) => {
      const y = T + j * rowH;
      s += `<text class="tick" x="${L - 6}" y="${y + 10}" text-anchor="end">${r.esn}</text>`;
      s += `<rect x="${x(r.earliest_t)}" y="${y + 3}" width="${x(r.limit_t + 1) - x(r.earliest_t)}" height="${rowH - 6}" rx="2" fill="var(--accent-soft)"><title>取卸しできる期間 ${c.months[r.earliest_t].label}〜${r.limit}</title></rect>`;
      s += `<rect x="${x(r.t)}" y="${y + 1}" width="${x(r.t + r.quoted_off_wing) - x(r.t)}" height="${rowH - 2}" rx="2" fill="${WS[r.workscope] || "var(--muted)"}" opacity=".9"><title>${r.esn} ${r.month} 入場（${r.workscope}、${esc(r.shop_name)}）→ ${r.quoted_off_wing} か月で戻る。${fmt(r.exp_cost)} 千ドル</title></rect>`;
      if (r.deadline_t >= 0) s += `<path d="M${x(r.deadline_t) + cw / 2} ${y + 1} l4 6 l-4 6 l-4 -6z" fill="var(--crit)"><title>判断期限 ${r.decide_by}（${esc(r.deadline_reason)}）</title></path>`;
      else s += `<path d="M${L + 2} ${y + 7} l6 -4 v8z" fill="var(--muted)"><title>計画開始前に手配済み（前提）</title></path>`;
      if (r.watch) s += `<circle cx="${x(r.t + r.quoted_off_wing) + 5}" cy="${y + 7}" r="3" fill="var(--warn)"><title>要監視</title></circle>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="エンジンごとの計画">${s}</svg>`;
  }

  /* ---------------- level 1 ---------------- */
  function summary() {
    const c = C();
    const lines = c.verdict.map((l) => `<div class="line"><span class="q">${l.q}</span><span class="a">${esc(l.a)}</span></div>`).join("");
    const f = c.fiscal_years, worst = f.reduce((a, b) => (b.over > a.over ? b : a), f[0]);
    const tr = c.track, inv = c.invest;
    const due3 = c.months.slice(0, 3).reduce((a, r) => a + r.due, 0);
    const cards = [
      card("budget", worst.over > 0.05 ? "flag" : "ok", "年間計画と予算", worst.over > 0.05 ? `${worst.fy} は予算を超える` : "予算内", fyBars(c, 320, true)),
      card("month", due3 ? "warn" : "ok", "今月からの判断", `3 か月以内に ${due3} 件の判断`, ""),
      card("track", tr && !tr.world_is_base ? "warn" : "ok", "計画の追跡", tr ? (tr.recommend === "switch" ? `乗り換えを推奨：${esc(tr.switch_to)}` : "今の計画を続けてよい") : "実績なし", tr ? trackChart(tr, 320, 70, true) : ""),
      card("actions", "ok", "打ち手の効果", "左下ほど安くて安全", scatter(c, 320, 150, true)),
      card("invest", inv ? (inv.recommend.go ? "ok" : "warn") : "", "国内工場の新設（LEAP-1B）", inv ? esc(inv.headline) : "試算中", inv ? breakevenChart(inv.breakeven, 320, 170) : ""),
      c.history ? card("history", histCls(c), "過去の計画との整合", histLine(c), stabilityChart(c.history, 320, 90, true)) : "",
      c.roll ? card("roll", "ok", "次の版への引き継ぎ", rollLine(c.roll), bridgeChart(c.roll, 320, 120, true)) : "",
      card("horizon", c.horizons.score >= 0.7 ? "ok" : "warn", "時間軸のつながり", `長期から短期へのつながり ${Math.round(c.horizons.score * 100)}%`, horizonChart(c.horizons, 320, 150, true)),
      card("sources", c.unsourced.length ? "warn" : "ok", "前提と出典", `出典のない数字 ${c.unsourced.length} 件`, ""),
    ];
    const u = c.usecases;
    const extra = [
      card("quote", "", "見積もりの承認", `追加作業は、延びる 1 か月あたり ${(u.value_per_engine_month * 1000).toFixed(0)} 千ドルまでなら承認が得`, quoteChart(u, 320, 130, true)),
      card("trend", "", "状態監視の警報", trendLine(u), trendChart(u, 320, 130, true)),
      card("spares", sparesCls(u), "予備エンジンの数", sparesCostLine(u), sparesChart(u, 320, 130, true)),
      card("offer", "", "エンジンの打診", offerLine(u), offerChart(u, 320, 130, true)),
      card("cash", "", "支払いと為替", cashLine(u), cashChart(u, 320, 130, true)),
      card("reliability", u.reliability.above ? "flag" : "ok", "信頼性管理", relLine(u), relChart(u, 320, 130, true)),
    ];
    const keyOf = (h) => (h.match(/data-go="([a-z]+)"/) || [])[1];
    const all = [...cards, ...extra].filter(Boolean).filter((h) => role === "all" || (CARD_ROLES[keyOf(h)] || []).includes(role));
    const roleBar = `<div class="tabs" role="tablist" aria-label="見方">${Object.entries(ROLES).map(([k, l]) => `<button type="button" role="tab" data-role="${k}" aria-selected="${k === role}">${l}</button>`).join("")}</div>`;
    const rl = roleLine(c);
    return roleBar + `<section class="panel verdict" aria-label="結論">${rl ? `<div class="line"><span class="q">${ROLES[role]}の視点</span><span class="a">${esc(rl)}</span></div>` : ""}${lines}</section>`
      + (role === "all" || role === "ops" || role === "plan" || role === "exec" ? panel("この 24 か月の地図", monthMap(c) + legendMap + G("monthmap"), "マスにマウスを載せると数字が出ます。") : "")
      + `<div class="cards">${all.join("")}</div>`;
  }

  /* ---------------- level 2 ---------------- */
  function budget() {
    const c = C(), f = c.fiscal_years, worst = f.reduce((a, b) => (b.over > a.over ? b : a), f[0]);
    return `<div class="vgrid">${panel("", `<p class="chart-note">${worst.over > 0.05 ? `${worst.fy} は予算を ${Math.round(worst.over * 100)}% 超える` : "どの年度も予算内"}</p>` + fyBars(c) + G("fybars") + `<div class="legend"><span><span class="sw" style="background:var(--accent)"></span>計画の整備費</span><span><span class="sw" style="background:var(--ink);width:3px"></span>予算（平年並み）</span><span><span class="sw" style="background:var(--crit)"></span>予算超過</span></div>`, c.relaxed.includes("budget") ? "平年並みの予算ではこの期間に期限の来るエンジンを回しきれないため、予算の条件を外して解いています。" : "")}`
      + `${panel("", `<p class="chart-note">10 年先まで：入場は年によって大きく波打つ（点線＝平年）</p>` + outlookChart(c) + wsLegend + G("outlook"))}</div>`
      + `<div class="cards">${card("engines", "", "エンジン別の明細", "取卸しできる期間・入場・戻り・判断期限を 1 基ずつ", "")}</div>`;
  }

  function month() {
    const c = C();
    return panel("", `<p class="chart-note">いつ詰まり、いつ判断が要るか</p>` + monthMap(c) + legendMap + G("monthmap"))
      + panel("", `<p class="chart-note">エンジンごとの予定（先頭 3 か月に判断が集中）</p>` + gantt(c) + ganttLegend + G("gantt"), "");
  }
  const ganttLegend = `<div class="legend"><span><span class="sw" style="background:var(--accent-soft)"></span>取卸しできる期間</span><span><span class="sw" style="background:var(--ws-pr)"></span><span class="sw" style="background:var(--ws-core)"></span><span class="sw" style="background:var(--ws-full)"></span>入場から戻りまで（整備範囲の色）</span><span><span class="sw" style="background:var(--crit)"></span>判断期限</span><span><span class="sw" style="background:var(--muted)"></span>手配済み（前提）</span><span><span class="sw" style="background:var(--warn);border-radius:50%"></span>要監視</span></div>`;

  function track() {
    const t = C().track;
    if (!t) return panel("計画の追跡", '<p class="hint">実績がまだありません。</p>');
    return `<div class="vgrid">${panel("", `<p class="chart-note">前提は${t.world_is_base ? "基準どおり" : esc(t.world) + "に近づいている"}（${t.as_of} 時点 ${pct(t.world_p)}）${t.demo ? "・デモ用の合成実績" : ""}</p>` + trackChart(t) + worldLegend(t) + G("posterior"))}`
      + `${panel("", `<p class="chart-note">${t.recommend === "switch" ? "乗り換えると得（黄色の帯を超えた）" : "乗り換えても得にならない（黄色の帯より下）"}</p>` + switchChart(t) + G("switch"), "線：最も得な乗り換え先の期待差額（百万ドル）。黄色の帯は得でも小さい範囲（0.3 百万ドル未満）。")}</div>`;
  }

  function actions() {
    const c = C();
    return panel("", `<p class="chart-note">打ち手・状況ごとの、費用とリスクの動き（基準の計画からの差、2 年）</p>` + scatter(c, 1000, 460) + G("scatter"), "点にマウスを載せると数字が出ます。部品取りは機体が減る 737-8 受領の場合を除き、欠航リスクが大きく上がります。グリーンタイム・エンジンの入手数は楽観的な仮定です。");
  }

  function invest() {
    const v = C().invest;
    if (!v) return panel("国内工場の新設（LEAP-1B）", '<p class="hint">試算中です。</p>');
    return panel("", `<p class="chart-note">${esc(v.headline)}</p><p class="hint">${esc(v.why)}</p>`)
      + `<div class="vgrid">${panel("", `<p class="chart-note">何があれば得になるか：受託の件数が決め手、補助は効きが小さい</p>` + breakevenChart(v.breakeven) + G("breakeven"), esc(v.breakeven.note))}`
      + `${panel("", `<p class="chart-note">案ごとの損得の幅（正味現在価値、百万ドル）</p>` + npvChart(v) + G("npv"), "線は 10〜90% の幅、点は平均。0 より右なら海外に出し続けるより得。")}</div>`
      + `<div class="vgrid">${panel("", `<p class="chart-note">損得の内訳：交渉で下がる海外の価格（ゲーム理論）が、どれだけ効くか</p>` + partsChart(v) + partsLegend + G("parts"), "交渉＝国内に能力を持つことで、海外に残る入場の価格が下がる分（ナッシュ交渉）。足元＝建てた後にメーカーが部品・認可の条件を厳しくする分。")}`
      + `${v.consortium ? panel("", `<p class="chart-note">3 社で組むと：単独よりずっと損が小さく、IHI の技術が価値を生む</p>` + consortiumChart(v.consortium) + G("consortium"), esc(v.consortium.note)) : ""}</div>`
      + (v.market ? `<div class="vgrid">${panel("", `<p class="chart-note">受託の取り合い：日本が先に決めると多く取れる（先手の価値）</p>` + marketChart(v.market) + G("market"), `3 者が同時に決めた場合と日本が先に決めた場合の能力（年間の受託件数）。段階 1〜3 の価値は ${Math.round(v.market.npv_simultaneous.commit123)} → ${Math.round(v.market.npv_if_first.commit123)} 百万ドル。先に決めることは「待って様子を見る」選択を捨てることでもある。`)}`
      + `${v.booking ? panel("", `<p class="chart-note">海外の枠の取り合い：入場待ちが長い間は囚人のジレンマ</p>` + bookingMatrix(v.booking) + bookingTimeline(v.booking) + G("booking"), `割増を払って早めに押さえると自分の待ちが減り、相手の待ちが増える。待ちが ${v.booking.threshold_months.toFixed(1)} か月を超える間は、両社とも早めに押さえるのが自分にとって最善（赤枠）だが、両社とも待つほうが両社とも得（緑の点線）。今の 737-800 のエンジンで、互いに払い合う割増は今の価値で約 ${v.booking.pv_cfm56.toFixed(1)} 百万ドル。共同で枠を押さえる（プール）ことの価値でもある。`) : ""}</div>` : "")
      + `<div class="vgrid">${panel("", `<p class="chart-note">国内の自社の入場（年）：737-8 の受領に遅れて立ち上がる</p>` + demandChart(v) + G("demand"), "帯は 10〜90%、線は中央値。短期入場（破線）は機数に比例。")}`
      + `${panel("", `<p class="chart-note">海外の入場待ち（か月）：世界の整備能力が追いつくと縮む</p>` + queueChart(v) + G("queue"), "国内化の価値の大半は、往復の輸送（2 か月）と入場待ちの分だけ予備エンジンを借りずに済むこと。")}</div>`
      + `<details class="panel"><summary>前提と出典</summary><div class="scroll"><table><tbody>${Object.entries(v.sources).map(([k, t]) => `<tr><td class="mono">${esc(k)}</td><td class="src">${esc(t).replace(/(https?:\/\/[^\s）)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')}</td></tr>`).join("")}</tbody></table></div><p class="hint">${esc(v.note)}</p></details>`;
  }

  // horizons: log time axis from a month to 20 years; links from long to short
  function horizonChart(hz, W = 900, H0 = 0, compact = false) {
    const Ls = hz.layers, L = compact ? 6 : 210, R = compact ? 6 : 16, rowH = compact ? 18 : 30, laneW = compact ? 0 : 0, T = compact ? 4 : 24;

    const yOf = (id) => T + Ls.findIndex((l) => l.id === id) * rowH + rowH / 2;
    let s = "";
    if (!compact) [[1, "1 か月"], [3, "3 か月"], [12, "1 年"], [24, "2 年"], [120, "10 年"], [240, "20 年"]].forEach(([m, t]) => { s += `<line x1="${lx(m)}" x2="${lx(m)}" y1="${T - 6}" y2="${H - 26}" stroke="var(--rule)" stroke-dasharray="2 4"/><text class="tick" x="${lx(m)}" y="${T - 10}" text-anchor="middle">${t}</text>`; });
    Ls.forEach((l, i) => {
      const y = T + i * rowH;
      if (!compact) s += `<text class="lbl" x="${L - 8}" y="${y + rowH / 2 + 4}" text-anchor="end">${esc(l.label)}</text>`;
      s += `<rect x="${L}" y="${y + 4}" width="${Math.max(4, lx(Math.max(1.05, l.months)) - L)}" height="${rowH - 8}" rx="4" fill="${l.have ? "var(--accent-soft)" : "var(--ground)"}" stroke="${l.have ? "var(--accent)" : "var(--muted)"}" stroke-dasharray="${l.have ? "" : "3 3"}"/>`;
    });
    const col = { ok: "var(--good)", warn: "var(--warn)", bad: "var(--crit)" };
    hz.links.forEach((k, j) => {
      const y1 = yOf(k.from), y2 = yOf(k.to), x = compact ? W - 12 - j * 7 : lx(240) - 10 - j * 16;
      if (k.from === k.to) s += `<circle cx="${x}" cy="${y1}" r="${compact ? 3 : 6}" fill="none" stroke="${col[k.status]}" stroke-width="2"><title>${esc(k.what)}：${esc(k.measure || "")}</title></circle>`;
      else s += `<path d="M${x} ${y1} L${x} ${y2 - 4}" stroke="${col[k.status]}" stroke-width="${compact ? 2 : 3}" stroke-dasharray="${k.status === "bad" ? "4 3" : ""}" marker-end="url(#ar-${k.status})"><title>${esc(k.what)}：${esc(k.measure || "")}</title></path>`;
      if (!compact) s += `<text class="tick" x="${x}" y="${Math.min(y1, y2) - 3}" text-anchor="middle">${j + 1}</text>`;
    });
    const defs = Object.entries(col).map(([k, c]) => `<marker id="ar-${k}" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="${c}"/></marker>`).join("");

  }

        c.roll ? Object.entries(c.roll.learned).filter(([k, e]) => "weight" in e).map(([k, e]) => `${{ delay: "工期", findings: "所見", unsched: "予定外", hazard: "故障" }[k]} 重み ${Math.round(e.weight * 100)}%`).join("、") : "", "重みの根拠（何件で半々とするか）は仮の値。実データが数年分たまれば、業界値との混ぜ方を実績で決められる"],
      quote: ["見積もりで追加作業を示されたとき、いくらまでなら承認してよいか", `横が「その作業で次の入場が何か月先に延びるか」、縦が作業の費用。線より下（緑）なら承認が得。1 か月延びる価値は ${(u.value_per_engine_month * 1000).toFixed(0)} 千ドル（1 基が 1 か月飛ぶごとに積もる整備費）`,
        "例：タービン翼の追加交換 0.45 百万ドルで 6 か月延びるなら承認、寿命部品の早め交換 1.2 百万ドルで 14 か月なら承認", "工場から見積もりが来たら、延びる月数を技術担当に見積もってもらい、この線と比べて即答する"],
      trend: ["状態監視で警報が出たエンジンを、今下ろすか様子を見るか", "横が「あと何か月飛ばすか」、縦が見込みの損。青＝今下ろすと失う飛べる寿命、それ以外＝待って故障した場合の損（通常・要監視・繁忙期）。青より上の線は「待つほうが損」", trendLine(u), "要監視のエンジンで残りが短い、または繁忙期にかかるなら、次の枠で下ろす手配をする"],
      sparescost: ["予備を 1 基増やすごとに、持つ費用（右上がり）と足りない損（右下がり）がどう動くか。合計が最も低いところが、ちょうどよい数", "黒い太線が今の工期での合計。U 字の底がちょうどよい数で、そこより右は持ちすぎ（持つ費用が得を上回る）、左は不足。緑・赤の点線は、工期が平常に戻った場合と、さらに延びた場合の合計",
        sparesCostLine(u), "工期が縮む見通しに合わせて、余る予備の出口（他社への貸し出し、売却、残り寿命の使い切り、ANA と JAL の共同プール）を先に決めておく。逆に延びる見通しなら短期リースの枠を押さえる"],
      spares: ["予備エンジンを何基持てば、工場に出ている分を埋められるか", `横が予備の数、縦が足りる確率。曲線は工場の工期ごと（工期が長いほど右にずれ、多くの予備が要る）。黒い縦線が今の予備（${u.spares.have} 基）、点線が業界の目安（取付の 10%）`, sparesLine(u), "工期が延びる見通しなら、リースかプール契約で数基の余裕を確保する"],
      offer: ["エンジンの売り込みが来たとき、いくらまでなら買ってよいか", "横が残りの飛行回数、縦が払ってよい上限。青の線より安ければ買いが得。茶色の帯が市場の相場（ハーフライフ）", offerLine(u), "相手の言い値が線より上なら、線の値を上限に交渉する。記録の欠けや推力の型はさらに差し引く"],
      cash: ["月ごとの支払い（棒）と、その累計（黒線）、予算の累計（赤い点線）", "黒線が赤い点線より上なら、予算より早く・多くお金が出ている。支払いは工場から戻った月に集中する", cashLine(u), "支払いの山の月に合わせて資金を手当てする。ドル建てなので、円安に振れると円の支払いが増える"],
      reliability: ["予定外の取卸し（故障などで計画外に下ろした数）の率の推移。当局向けの信頼性管理と同じ形", "線が 3 か月の平均、赤い点線が警戒値（過去の平均＋3 標準偏差）。線が警戒値を超えたら原因の調査が要る", relLine(u), "超えた月が出たら、原因を調べて信頼性管理の会議にかける"],
      sources: ["数字の種類ごとに、出典のあるもの（緑）とないもの（黄）の数", "黄が多い種類ほど、仮定に頼っている", `出典のない数字は ${c.unsourced.length} 件`, "黄の多い種類から、実データか社内の合意値に置き換える"],
    };
    const g = T[key];
    if (!g) return "";
    return `<div class="guide"><div><b>何の図か</b>${esc(g[0])}</div><div><b>どう読むか</b>${esc(g[1])}</div><div class="say"><b>ここから言えること</b>${esc(g[2])}</div><div><b>次にすること</b>${esc(g[3])}</div></div>`;
  }

  /* ---------------- roll to the next version ---------------- */
  const rollLine = (r) => { const st = r.bridge.steps; return `${r.to_version} 版の 1 年目は ${musd(st[3].value)} 百万ドル：前の版の 2 年目 ${musd(st[0].value)} に、機材の状態の動き ${st[1].value >= 0 ? "+" : "−"}${musd(Math.abs(st[1].value))}、前提の修正 ${st[2].value >= 0 ? "+" : "−"}${musd(Math.abs(st[2].value))}`; };
  function bridgeChart(r, W = 900, H = 260, compact = false) {
    const st = r.bridge.steps, L = compact ? 6 : 60, R = compact ? 6 : 16, T = compact ? 6 : 14, B = compact ? 6 : 60, n = st.length, bw = (W - L - R) / n;
    const top = Math.max(...st.map((x) => x.kind === "level" ? x.value : 0)) * 1.15, y = (v) => H - B - v / top * (H - T - B);
    let s = "", acc = 0;
    st.forEach((x, i) => {
      const x0 = L + i * bw + bw * 0.18, w = bw * 0.64;
      if (x.kind === "level") { s += `<rect x="${x0}" y="${y(x.value)}" width="${w}" height="${y(0) - y(x.value)}" fill="${i === 0 ? "var(--muted)" : "var(--ink)"}"><title>${esc(x.label)} ${musd(x.value)} 百万ドル</title></rect>`; acc = x.value; }
      else { const a = acc, b2 = acc + x.value; s += `<rect x="${x0}" y="${y(Math.max(a, b2))}" width="${w}" height="${Math.abs(y(a) - y(b2))}" fill="${x.value >= 0 ? "var(--crit)" : "var(--good)"}"><title>${esc(x.label)} ${x.value >= 0 ? "+" : ""}${musd(x.value)} 百万ドル</title></rect><line x1="${x0 - bw * 0.18}" x2="${x0 + w}" y1="${y(a)}" y2="${y(a)}" stroke="var(--rule)"/>`; acc = b2; }
      if (!compact) { const lab = x.label.replace(/（.*?）/g, ""); s += `<text class="tick" x="${x0 + w / 2}" y="${H - B + 14}" text-anchor="middle">${esc(lab.length > 18 ? lab.slice(0, 18) + "…" : lab)}</text><text class="tick" x="${x0 + w / 2}" y="${y(x.kind === "level" ? x.value : Math.max(acc, acc - x.value)) - 4}" text-anchor="middle">${x.kind === "delta" ? (x.value >= 0 ? "+" : "") : ""}${musd(x.value)}</text>`; }
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="版の橋渡し">${s}</svg>`;
  }
  function learnedChart(r, W = 900) {
    const E = Object.entries(r.learned).filter(([k, e]) => "weight" in e && e.prior != null && e.observed != null), rowH = 44, L = 170, H = E.length * rowH + 10;
    let s = "";
    E.forEach(([k, e], i) => {
      const y = 8 + i * rowH, lo = Math.min(e.prior, e.observed, e.updated), hi = Math.max(e.prior, e.observed, e.updated), span = (hi - lo) || 1;
      const x = (v) => L + 40 + (v - lo) / span * (W - L - 330);
      const name = { delay: "工期の遅れ（か月）", findings: "請求 ÷ 見込み", unsched: "予定外の率（1 基 1 か月）", hazard: "故障で前倒し（基）" }[k] || k;
      s += `<text class="lbl" x="${L - 8}" y="${y + 14}" text-anchor="end">${name}</text>`;
      s += `<line x1="${x(e.prior)}" x2="${x(e.observed)}" y1="${y + 10}" y2="${y + 10}" stroke="var(--rule)" stroke-width="2"/>`;
      s += `<circle cx="${x(e.prior)}" cy="${y + 10}" r="5" fill="var(--surface)" stroke="var(--muted)" stroke-width="2"><title>前の版の前提 ${e.prior}</title></circle>`;
      s += `<circle cx="${x(e.observed)}" cy="${y + 10}" r="5" fill="var(--warn)"><title>実績 ${e.observed}（n=${e.n}）</title></circle>`;
      s += `<circle cx="${x(e.updated)}" cy="${y + 10}" r="6" fill="var(--ink)"><title>次の版の前提 ${e.updated}</title></circle>`;
      s += `<text class="tick" x="${W - 280}" y="${y + 14}">${Number(e.prior).toPrecision(3)} → ${Number(e.updated).toPrecision(3)}（実績の重み ${Math.round(e.weight * 100)}%、n=${e.n}）</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="実績で直した前提">${s}</svg><div class="legend"><span><span class="sw" style="background:var(--surface);border:2px solid var(--muted);border-radius:50%"></span>前の版の前提</span><span><span class="sw" style="background:var(--warn);border-radius:50%"></span>実績</span><span><span class="sw" style="background:var(--ink);border-radius:50%"></span>次の版の前提（実績の重みで混ぜた値）</span></div>`;
  }
  function roll() {
    const r = C().roll;
    if (!r) return panel("次の版への引き継ぎ", '<p class="hint">まだ版を更新していません。</p>');
    const ca = r.carried, wp = Object.entries(r.learned.world.posterior).sort((a, b) => b[1] - a[1]);
    return panel("", `<p class="chart-note">${rollLine(r)}</p>` + bridgeChart(r) + G("bridge"))
      + panel("", `<p class="chart-note">1 年の実績で直した前提：観測が少ないものは前の値寄り、多いものは実績寄り</p>` + learnedChart(r) + G("learned"), "重み＝観測数 ÷（観測数＋12）。前提の確率も引き継ぐ：" + wp.map(([w, p]) => `${w} ${Math.round(p * 100)}%`).join("、"))
      + panel("引き継いだもの", `<p>前の版で手配済み（枠の予約・部品の発注）の入場 <b>${ca.fixed.length} 基</b> を、次の版でも同じ月・同じ整備範囲に固定。寿命部品キットは手持ち ${ca.kits.old_on_hand} → 使用 ${ca.kits.used}、発注済み ${ca.kits.ordered} → 次の版の手持ち ${ca.kits.new_on_hand}。</p>` + (ca.fixed.length ? `<div class="chips">${ca.fixed.map((f) => `<span title="${esc(f.reason)}">${f.esn} ${f.month} ${f.workscope}</span>`).join("")}</div>` : ""), "固定した入場は次の版の最適化では動かせない。動かすと違約や緊急手配になるため");
  }

  /* ---------------- everyday decisions ---------------- */
  // one line chart for all of them: series of {ys, color, dash, label}, optional bands / verticals / points
  function lineChart(o, W, H, compact) {
    const L = compact ? 6 : 52, R = compact ? 6 : 16, T = compact ? 6 : 16, B = compact ? 6 : 34;
    const xs = o.xs, allY = o.series.flatMap((s_) => s_.ys).concat((o.points || []).map((p) => p.y)).concat(o.ymin != null ? [o.ymin] : [0]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...allY), y1 = Math.max(...allY, o.ymax || 0) * 1.08;
    const X = (v) => L + (v - x0) / (x1 - x0) * (W - L - R), Y = (v) => T + (y1 - v) / (y1 - y0 || 1) * (H - T - B);
    let s = "";
    (o.bands || []).forEach((b) => { s += `<rect x="${X(b.x0)}" y="${Y(b.y1)}" width="${X(b.x1) - X(b.x0)}" height="${Y(b.y0) - Y(b.y1)}" fill="${b.color}" opacity="${b.opacity || 0.5}"><title>${esc(b.label || "")}</title></rect>`; });
    if (o.fillUnder) s += `<polygon fill="var(--good-soft)" points="${X(x0)},${Y(y0)} ${o.series[0].ys.map((v, i) => `${X(xs[i])},${Y(v)}`).join(" ")} ${X(x1)},${Y(y0)}"/>`;
    if (!compact) {
      (o.yticks || []).forEach((v) => { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${o.yfmt ? o.yfmt(v) : v}</text>`; });
      (o.xticks || []).forEach((v) => { s += `<text class="tick" x="${X(v)}" y="${H - B + 14}" text-anchor="middle">${o.xfmt ? o.xfmt(v) : v}</text>`; });
      if (o.xlabel) s += `<text class="tick" x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">${o.xlabel}</text>`;
      if (o.ylabel) s += `<text class="tick" x="12" y="${(T + H - B) / 2}" transform="rotate(-90 12 ${(T + H - B) / 2})" text-anchor="middle">${o.ylabel}</text>`;
    }
    (o.vlines || []).forEach((v) => { s += `<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${T}" y2="${H - B}" stroke="${v.color}" stroke-width="2" stroke-dasharray="${v.dash || ""}"><title>${esc(v.label)}</title></line>${compact ? "" : `<text class="tick" x="${X(v.x) + 4}" y="${T + 10 + (v.dy || 0)}">${esc(v.label)}</text>`}`; });
    (o.hlines || []).forEach((v) => { s += `<line x1="${L}" x2="${W - R}" y1="${Y(v.y)}" y2="${Y(v.y)}" stroke="${v.color}" stroke-width="2" stroke-dasharray="${v.dash || ""}"><title>${esc(v.label)}</title></line>${compact ? "" : `<text class="tick" x="${W - R}" y="${Y(v.y) - 4}" text-anchor="end">${esc(v.label)}</text>`}`; });
    (o.bars || []).forEach((bb) => { s += `<rect x="${X(bb.x) - bb.w / 2}" y="${Y(bb.y)}" width="${bb.w}" height="${Y(0) - Y(bb.y)}" fill="${bb.color}" opacity=".7"><title>${esc(bb.label)}</title></rect>`; });
    o.series.forEach((sr) => { s += `<polyline fill="none" stroke="${sr.color}" stroke-width="${compact ? 1.8 : 2.4}" stroke-dasharray="${sr.dash || ""}" points="${sr.ys.map((v, i) => `${X(xs[i])},${Y(v)}`).join(" ")}"><title>${esc(sr.label)}</title></polyline>`; });
    (o.points || []).forEach((p) => { s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${compact ? 3 : 5.5}" fill="${p.color}"><title>${esc(p.label)}</title></circle>${compact ? "" : `<text class="tick" x="${X(p.x) + 8}" y="${Y(p.y) + 4}">${esc(p.label)}</text>`}`; });
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "")}">${s}</svg>`;
  }
  const legend = (items) => `<div class="legend">${items.map(([l, c, d]) => `<span><span class="sw" style="background:${c};${d ? "height:2px" : ""}"></span>${l}</span>`).join("")}</div>`;

  function quoteChart(u, W = 900, H = 320, compact = false) {
    const q = u.quote, lim = (m) => m * u.value_per_engine_month;
    return lineChart({ xs: q.months, series: [{ ys: q.max_extra_cost, color: "var(--good)", label: "承認してよい上限額" }], fillUnder: true,
      points: q.examples.map((e) => ({ x: e.months, y: e.cost, color: e.cost <= lim(e.months) ? "var(--good)" : "var(--crit)", label: `${e.what}：${e.cost} 百万ドルで +${e.months} か月（${e.cost <= lim(e.months) ? "承認" : "見送り"}）` })),
      yticks: [0, 1, 2, 3], xticks: [0, 6, 12, 18, 24], yfmt: (v) => v + " M$", xlabel: "次の入場が先に延びる月数", ylabel: "追加作業の費用（百万ドル）", aria: "見積もり承認の上限" }, W, H, compact);
  }
  function quote() {
    const u = C().usecases;
    return panel("", `<p class="chart-note">追加作業は「延びる月数 × ${(u.value_per_engine_month * 1000).toFixed(0)} 千ドル」まで承認してよい（緑の領域なら承認）</p>` + quoteChart(u) + G("quote")
      + legend([["承認してよい上限額（線より下が承認）", "var(--good)", 1], ["例：承認が得", "var(--good)"], ["例：見送りが得", "var(--crit)"]]), `1 基が 1 か月飛ぶごとに積もる整備費（平年の整備費 ÷ 取付エンジン）を、延びる寿命の価値としています。${esc(u.quote.note)}。繁忙期をまたいで延びる、同じ機体の 2 基をずらせる、などの価値は含まない。`);
  }

  function trendLine(u) {
    const t = u.trend, r = t.remove_now, w = t.cases["要監視のエンジン"].wait, wp = t.cases["要監視のエンジン"].wait_peak;
    const k = w.findIndex((v, i) => i > 0 && v < r[i]);            // from here on, waiting is cheaper
    const peakAlways = wp.every((v, i) => i === 0 || v >= r[i]);
    return (k > 0 ? `要監視のエンジンは、残りの余裕が ${k} か月未満なら今下ろし、それ以上なら様子を見るほうが得` : "要監視のエンジンは警報が出たら今下ろすほうが得")
      + (peakAlways ? "（繁忙期にかかるなら常に下ろす）" : "");
  }
  function trendChart(u, W = 900, H = 320, compact = false) {
    const t = u.trend, c = t.cases;
    return lineChart({ xs: t.months, series: [
      { ys: t.remove_now, color: "var(--accent)", label: "今下ろす：失う飛べる寿命" },
      { ys: c["通常のエンジン"].wait, color: "var(--good)", dash: "5 4", label: "待つ：通常のエンジン（故障率 月 1%）" },
      { ys: c["要監視のエンジン"].wait, color: "var(--warn)", label: "待つ：要監視（月 6%）" },
      { ys: c["要監視のエンジン"].wait_peak, color: "var(--crit)", label: "待つ：要監視・繁忙期にかかる" }],
      points: compact ? [] : (() => { const r = t.remove_now, w = c["要監視のエンジン"].wait, k = w.findIndex((x, i) => i > 0 && x < r[i]); return k > 0 ? [{ x: k, y: r[k], color: "var(--ink)", label: `ここから先は待つほうが得（要監視・${k} か月）` }] : []; })(),
      yticks: [0, 0.5, 1, 1.5], xticks: [0, 3, 6, 9, 12], yfmt: (v) => v + " M$", xlabel: "あと何か月飛ばすか（残りの余裕）", ylabel: "見込みの損（百万ドル）", aria: "警報時の判断" }, W, H, compact);
  }
  function trend() {
    const u = C().usecases;
    return panel("", `<p class="chart-note">${trendLine(u)}。通常のエンジンは待つほうが得</p>` + trendChart(u) + G("trend")
      + legend([["今下ろすと失う寿命", "var(--accent)", 1], ["待つ：通常", "var(--good)", 1], ["待つ：要監視", "var(--warn)", 1], ["待つ：要監視・繁忙期", "var(--crit)", 1]]), esc(u.trend.note));
  }

  const sparesCur = (u) => u.spares.curves["今の工期"][u.spares.have];
  const sparesCls = (u) => (sparesCur(u) < 0.9 ? "warn" : "ok");
  const sparesLine = (u) => `予備 ${u.spares.have} 基で足りる確率：今の工期 ${Math.round(sparesCur(u) * 100)}%、混雑が 2 か月延びると ${Math.round(u.spares.curves["混雑がさらに 2 か月"][u.spares.have] * 100)}%`;
  function sparesChart(u, W = 900, H = 320, compact = false) {
    const sp = u.spares, cols = ["var(--good)", "var(--accent)", "var(--crit)"];
    return lineChart({ xs: sp.spares, series: Object.entries(sp.curves).map(([k, ys], i) => ({ ys: ys.map((v) => v * 100), color: cols[i], label: k })),
      points: compact ? [] : [{ x: sp.have, y: sp.curves["今の工期"][sp.have] * 100, color: "var(--accent)", label: `今の予備・今の工期 → ${Math.round(sp.curves["今の工期"][sp.have] * 100)}%` }, { x: sp.have, y: sp.curves["混雑がさらに 2 か月"][sp.have] * 100, color: "var(--crit)", label: `混雑が延びると → ${Math.round(sp.curves["混雑がさらに 2 か月"][sp.have] * 100)}%` }],
      vlines: [{ x: sp.have, color: "var(--ink)", label: `今の予備 ${sp.have} 基` }, { x: sp.rule_10pct, color: "var(--muted)", dash: "4 3", label: "業界の目安 10%", dy: 14 }],
      yticks: [0, 50, 90, 100], xticks: [0, 5, 10, 15, 20, 25], yfmt: (v) => v + "%", xlabel: "予備エンジンの数（取付の最大を超えて持つ基数）", ylabel: "足りる確率", aria: "予備エンジンの数" }, W, H, compact);
  }
  function spares() {
    const u = C().usecases, sp = u.spares;
    return panel("", `<p class="chart-note">${sparesLine(u)}</p>` + sparesChart(u) + G("spares") + legend(Object.keys(sp.curves).map((k, i) => [`${k}（工場側に平均 ${sp.mean_off[k].toFixed(1)} 基）`, ["var(--good)", "var(--accent)", "var(--crit)"][i], 1])), esc(sp.note) + "業界の目安（取付の 10%）は、工期が長い今は足りない側に出ます。")
      + panel("", `<p class="chart-note">${sparesCostLine(u)}</p>` + sparesCostChart(u) + G("sparescost") + legend([["持つ費用（1 基ごとに増える）", "var(--warn)", 1], ["足りない損（リース・運休、予備が増えると減る）", "var(--accent)", 1], ["合計：今の工期", "var(--ink)", 1], ["合計：平常の工期", "var(--good)", 1], ["合計：混雑が 2 か月延びる", "var(--crit)", 1]]), esc(sp.note_cost));
  }
  const sparesCostLine = (u) => { const c = u.spares.cost, h = u.spares.have, now = c["今の工期"], nor = c["平常（工期 4 か月）"], con = c["混雑がさらに 2 か月"];
    const verdict = h > now.best ? `今の工期でも ${h - now.best} 基多く、年 ${now.excess_cost.toFixed(1)} 百万ドル余分` : h < now.best ? `今の工期では ${now.best - h} 基足りない` : "今の工期ではちょうどよい";
    return `ちょうどよい予備は、平常 ${nor.best} 基・今 ${now.best} 基・混雑 ${con.best} 基。今の ${h} 基は、${verdict}。工期が平常に戻ると年 ${nor.excess_cost.toFixed(1)} 百万ドルの持ちすぎ`; };
  function sparesCostChart(u, W = 900, H = 320) {
    const sp = u.spares, c = sp.cost, now = c["今の工期"], xs = sp.spares.slice(0, 21);
    const cut = (a) => a.slice(0, 21);
    return lineChart({ xs, series: [
      { ys: cut(now.hold), color: "var(--warn)", label: "持つ費用" }, { ys: cut(now.short), color: "var(--accent)", label: "足りない損（今の工期）" },
      { ys: cut(now.total), color: "var(--ink)", label: "合計（今の工期）" },
      { ys: cut(c["平常（工期 4 か月）"].total), color: "var(--good)", dash: "5 4", label: "合計（平常）" },
      { ys: cut(c["混雑がさらに 2 か月"].total), color: "var(--crit)", dash: "5 4", label: "合計（混雑）" }],
      ymax: 0, points: [{ x: now.best, y: now.total[now.best], color: "var(--ink)", label: `今の工期で最も安い ${now.best} 基` },
        { x: c["平常（工期 4 か月）"].best, y: c["平常（工期 4 か月）"].total[c["平常（工期 4 か月）"].best], color: "var(--good)", label: `平常なら ${c["平常（工期 4 か月）"].best} 基` }],
      vlines: [{ x: sp.have, color: "var(--muted)", dash: "3 3", label: `今の予備 ${sp.have} 基` }],
      yticks: [0, 10, 20, 30], xticks: [0, 5, 10, 15, 20], yfmt: (v) => v + " M$", xlabel: "予備エンジンの数", ylabel: "年間の費用（百万ドル）", aria: "予備の持ちすぎと不足の費用" }, W, H, false);
  }

  const offerLine = (u) => { const o = u.offer, i = o.cycles.indexOf(o.market.cycles); return `残り ${o.market.cycles.toLocaleString()} 回のエンジンは ${o.max_price[i].toFixed(1)} 百万ドルまでなら買い（相場 ${o.market.low}〜${o.market.high}）`; };
  function offerChart(u, W = 900, H = 320, compact = false) {
    const o = u.offer;
    return lineChart({ xs: o.cycles, series: [{ ys: o.max_price, color: "var(--accent)", label: "上限価格" }, { ys: o.max_price_peak, color: "var(--good)", dash: "5 4", label: "繁忙期の前に届く場合" }],
      bands: [{ x0: o.market.cycles - 700, x1: o.market.cycles + 700, y0: o.market.low, y1: o.market.high, color: "var(--warn)", label: o.market.source }],
      yticks: [0, 2, 4, 6, 8, 10], xticks: [0, 4000, 8000, 12000, 16000], xfmt: (v) => (v / 1000) + "k", yfmt: (v) => v + " M$", xlabel: "残りの飛行回数", ylabel: "払ってよい上限（百万ドル）", aria: "打診の上限価格" }, W, H, compact);
  }
  function offer() {
    const u = C().usecases;
    return panel("", `<p class="chart-note">${offerLine(u)}</p>` + offerChart(u) + G("offer") + legend([["上限価格", "var(--accent)", 1], ["繁忙期の前に届く場合", "var(--good)", 1], ["ハーフライフの相場（IBA 2025）", "var(--warn)"]]), esc(u.offer.note) + "。記録の欠け、推力の型、載せ替え費用は別に差し引く。");
  }

  const cashLine = (u) => `2 年の支払い ${u.cash.cum.at(-1).toFixed(0)} 百万ドル（予算 ${u.cash.cum_budget.at(-1).toFixed(0)}）。円では ${Math.round(u.cash.yen_oku.low)}〜${Math.round(u.cash.yen_oku.high)} 億円`;
  function cashChart(u, W = 900, H = 320, compact = false) {
    const c = u.cash, xs = c.labels.map((_, i) => i), bw = (W - 70) / xs.length * 0.6;
    return lineChart({ xs, series: [{ ys: c.cum, color: "var(--ink)", label: "支払いの累計" }, { ys: c.cum_budget, color: "var(--crit)", dash: "5 4", label: "予算の累計（季節で按分）" }],
      bars: c.pay.map((v, i) => ({ x: i, y: v, w: compact ? 3 : bw, color: "var(--accent)", label: `${c.labels[i]} 支払い ${v.toFixed(1)} 百万ドル` })),
      yticks: [0, 100, 200, 300], xticks: [0, 6, 12, 18, 23], xfmt: (i) => c.labels[i].slice(2), yfmt: (v) => v + " M$", xlabel: "月", ylabel: "百万ドル", aria: "支払い" }, W, H, compact);
  }
  function cash() {
    const u = C().usecases;
    return panel("", `<p class="chart-note">${cashLine(u)}</p>` + cashChart(u) + G("cash") + legend([["月ごとの支払い", "var(--accent)"], ["支払いの累計", "var(--ink)", 1], ["予算の累計", "var(--crit)", 1]]), esc(u.cash.note) + "。戻りの月に支払いが集中するので、入場の山より数か月遅れて支払いの山が来る。");
  }

  const relLine = (u) => `予定外取卸し率 ${u.reliability.mean.toFixed(3)}（1,000 時間あたり）、警戒値 ${u.reliability.alert.toFixed(3)} を超えた月 ${u.reliability.above}`;
  function relChart(u, W = 900, H = 320, compact = false) {
    const r = u.reliability, xs = r.labels.map((_, i) => i);
    return lineChart({ xs, series: [{ ys: r.uer_3m, color: "var(--accent)", label: "3 か月移動平均" }],
      hlines: [{ y: r.alert, color: "var(--crit)", dash: "5 4", label: "警戒値（平均＋3σ）" }, { y: r.mean, color: "var(--muted)", dash: "2 3", label: "平均" }],
      yticks: [0, 0.05, 0.1], xticks: [0, 12, 24, 35], xfmt: (i) => r.labels[i].slice(2), xlabel: "月（直近 3 年）", ylabel: "予定外取卸し / 1,000 時間", aria: "信頼性の管理図" }, W, H, compact);
  }
  function reliability() {
    const u = C().usecases;
    return panel("", `<p class="chart-note">${relLine(u)}</p>` + relChart(u) + G("reliability") + legend([["3 か月移動平均", "var(--accent)", 1], ["警戒値", "var(--crit)", 1], ["平均", "var(--muted)", 1]]), esc(u.reliability.note) + `。予定外を含む入場全体は 1,000 時間あたり ${u.reliability.svr_per_1000.toFixed(3)}。`);
  }

  function roleLine(c) {
    const u = c.usecases;
    return ({ exec: c.verdict[0].a, fin: cashLine(u), ops: sparesLine(u), plan: `${c.verdict[2].a}。${trendLine(u)}`, proc: offerLine(u), tech: relLine(u) })[role] || "";
  }

  /* ---------------- level 3 ---------------- */
  function engines() {
    const c = C();
    return panel("", `<p class="chart-note">${c.plan.length} 基の予定</p>` + gantt(c) + ganttLegend + G("gantt"), "バーにマウスを載せると、工場・費用・判断期限の理由が出ます。");
  }

  /* ---------------- level 4 ---------------- */
  function sources() {
    const c = C();
    const flat = [];
    const walk = (k, v) => { if (v && typeof v === "object") Object.entries(v).forEach(([kk, vv]) => walk(`${k} / ${kk}`, vv)); else if (v) flat.push([k, v]); };
    Object.entries(c.sources).forEach(([k, v]) => walk(k, v));
    const cats = {};
    flat.forEach(([k]) => { const g = k.split(" / ")[0]; cats[g] = cats[g] || [0, 0]; cats[g][0]++; });
    c.unsourced.forEach((u) => { const g = u.where.split(".")[1] || u.where; cats[g] = cats[g] || [0, 0]; cats[g][1]++; });
    const E = Object.entries(cats), W = 560, rowH = 22, L = 110, H = E.length * rowH + 10, top = Math.max(...E.map(([, v]) => v[0] + v[1]));
    let s = "";
    E.forEach(([g, [a, b]], i) => { const y = 4 + i * rowH, x = (v) => L + v / top * (W - L - 20); s += `<text class="lbl" x="${L - 8}" y="${y + 13}" text-anchor="end">${esc(g)}</text><rect x="${L}" y="${y + 2}" width="${x(a) - L}" height="14" fill="var(--good)"/><rect x="${x(a)}" y="${y + 2}" width="${x(a + b) - x(a)}" height="14" fill="var(--warn)"/>`; });
    const link = (t) => esc(t).replace(/(https?:\/\/[^\s）)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    return panel("", `<p class="chart-note">どこまで根拠があるか（緑＝出典あり、黄＝出典なし）</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="出典の有無">${s}</svg>` + G("sources"))
      + `<details class="panel"><summary>出典の一覧</summary><div class="scroll"><table><tbody>${flat.map(([k, v]) => `<tr><td class="mono" style="white-space:nowrap">${esc(k)}</td><td class="src">${link(v)}</td></tr>`).join("")}</tbody></table></div></details>`
      + `<details class="panel"><summary>出典のない数字（${c.unsourced.length} 件）</summary><div class="scroll"><table><tbody>${c.unsourced.map((u) => `<tr><td class="mono" style="white-space:nowrap">${esc(u.where)}</td><td class="src">${esc(u.what)}</td></tr>`).join("")}</tbody></table></div></details>`;
  }

  render();
})();
</script>
