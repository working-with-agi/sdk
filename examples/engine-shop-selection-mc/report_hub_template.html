      + panel("", `<table><thead><tr><th>種類</th><th>仕組み</th><th>式で（百万ドル、＋が得）</th><th>シミュレーションで（同、AOG の変化）</th><th>現金（今入る＋／今出る−）</th><th>資産（B/S）</th><th>何を・どう計算したか</th><th>確度</th></tr></thead><tbody>${rows}</tbody></table>`,
        `割引率 ${(F.params.discount_rate * 100).toFixed(0)}%、実効税率 ${(F.params.tax_rate * 100).toFixed(1)}%。前払いは短期前払費用の特例（継続役務）に当たらないので、税の得はない。`);
  }

  /* ---------------- after-tax yardstick ---------------- */
  const taxLine = (T) => { const S = T.split, sp = T.spares.rows, r2 = sp.find((x) => x.years === 2), r10 = sp.find((x) => x.years === 10), sh = T.shops.rows; const nm = { buy: "購入", long: "長期リース", short: "短期リース" };
    return `税引後の整備費は 2 年で ${musd(S.after_tax_in_window_k)} 百万ドル（税引前 ${musd(S.total_spend_k)}、盾の現在価値 ${musd(S.shield_pv_k)}）。予備 1 基は 2 年なら${nm[r2.best]}、10 年なら${nm[r10.best]}。工場の税引後の順位は ${sh[0].id} が最も安く ${sh[sh.length - 1].id} が最も高い（税引前と同じ）`; };
  function taxChart(T, W = 900, H = 260, compact = false) {

  function tax() {

    const shares = ["PR", "CORE", "FULL"].map((w) => `${w} 修繕 ${pct(S.shares[w].repair)}／資本 ${pct(S.shares[w].capital)}`).join("、");
    const p1 = panel("", `<p class="chart-note">${esc(taxLine(T))}</p>` + taxChart(T) + legend([["税引後の費用", "var(--accent)"], ["税の盾（損金・償却 × 税率）", "var(--accent-soft)"]]) + G("tax")
      + `<table><thead><tr><th>年度</th><th>実効税率</th><th>費用（税引前）</th><th>修繕費</th><th>資本的支出</th><th>償却（税務）</th><th>税の盾</th><th>税引後</th><th>繰延税金負債（概算・累計）</th></tr></thead><tbody>${splitRows}</tbody></table>`,
      `百万ドル。整備範囲ごとの区分は合成の仮定（${shares}）で、実際の会社の会計方針ではない。資本的支出は定率法 10 年（初年度 0.2）。盾の現在価値 ${k(S.shield_pv_k)}、窓の中で戻る盾 ${k(S.shield_in_window_k)}（総額 ${k(S.shield_total_k)}）。繰延税金負債は税務の定率法と会計の定額法の差 × 税率の概算（確度 C）。`);
    // 2. shift between fiscal years
    const sh = T.shift;
    const p2 = !sh ? "" : panel("年度をまたぐ動き（" + esc(sh.question) + "）",
      `<table><thead><tr><th>年度</th><th>費用の動き（税引前）</th><th>税の動き</th><th>税引後の動き</th></tr></thead><tbody>${sh.rows.map((x) => `<tr><td>${x.fy}</td><td>${(x.spend / 1000).toFixed(2)}</td><td>${(x.tax_effect / 1000).toFixed(2)}</td><td>${(x.after_tax / 1000).toFixed(2)}</td></tr>`).join("")}</tbody></table>`
      + `<p class="chart-note">後の年度に移る費用 ${(sh.moved_k / 1000).toFixed(2)} 百万ドル。税引前の差 ${(sh.pre_tax_delta_k / 1000).toFixed(2)}、税引後の差 ${(sh.after_tax_delta_k / 1000).toFixed(2)}。納税が 1 年遅れる分の時間価値 ${(sh.timing_value_k / 1000).toFixed(3)} 百万ドル（税率 × 移る額 × (1 − 1/(1+r))）</p>`, esc(sh.note));
    // 3. spares
    const sp = T.spares;
    const cv = sp.curve || [];
    const spChart = cv.length ? lineChart({ xs: cv.map((c_) => c_.years), series: [{ ys: cv.map((c_) => c_.buy / 1000), color: "var(--ink)" }, { ys: cv.map((c_) => c_.long / 1000), color: "var(--accent)" }, { ys: cv.map((c_) => c_.short / 1000), color: "var(--warn)", dash: "4 3" }],
      vlines: [{ x: 5, color: "var(--muted)", dash: "4 3", label: "5 年で見る" }].concat(sp.crossover_years ? [{ x: sp.crossover_years, color: "var(--good)", label: `${sp.crossover_years} 年目から購入が得` }] : []),
      yticks: [0, 2, 4, 6, 8], xticks: cv.map((c_) => c_.years), xfmt: (v) => v + " 年", yfmt: (v) => v + " M$", xlabel: "持つ年数（10 年の中で）", ylabel: "税引後の現在価値（百万ドル）", aria: "予備 1 基の持ち方" }, 900, 260)
      + legend([["購入（償却の盾・残存簿価を引く）", "var(--ink)", 1], ["長期リース", "var(--accent)", 1], ["短期リース", "var(--warn)", 1]]) : "";
    const p3 = panel("予備エンジン 1 基：購入／長期リース／短期リース（税引後の現在価値、10 年の中で 5 年を見る）", spChart +
      `<table><thead><tr><th>期間</th><th>購入（${sp.price_k.toLocaleString()} k$、償却の盾と残存簿価を引く）</th><th>長期リース（${sp.long_per_month} k$/月）</th><th>短期リース（${sp.short_per_month} k$/月）</th><th>安いのは</th></tr></thead><tbody>${sp.rows.map((x) => `<tr><td>${x.years} 年</td><td>${k(x.buy.after_tax_pv)}（税引前 ${k(x.buy.pre_tax_pv)}、盾 ${k(x.buy.shield_pv)}）</td><td>${k(x.long.after_tax_pv)}（税引前 ${k(x.long.pre_tax_pv)}）</td><td>${k(x.short.after_tax_pv)}（税引前 ${k(x.short.pre_tax_pv)}）</td><td><b>${nm[x.best]}</b></td></tr>`).join("")}</tbody></table>`, esc(sp.note));
    // 4. invest
    const iv = T.invest;
    const p4 = !iv || !iv.rows.length ? "" : panel("国内工場：税引後 NPV と補助金の扱い（百万ドル）",
      `<table><thead><tr><th>方針</th><th>投資（名目）</th><th>税引前 NPV</th><th>償却の盾（現在価値）</th><th>税引後 NPV（補助金なし）</th><th>補助金 ${pct(iv.subsidy_share)}・受取時に課税</th><th>補助金 ${pct(iv.subsidy_share)}・圧縮記帳</th><th>圧縮記帳の差</th></tr></thead><tbody>${iv.rows.map((x) => `<tr><td>${esc(x.label)}</td><td>${k(x.capex_k)}</td><td>${k(x.npv_pre_tax_k)}</td><td>${k(x.shield_pv_k)}</td><td>${k(x.after_tax_no_subsidy_k)}</td><td>${k(x.after_tax_subsidy_taxed_k)}</td><td><b>${k(x.after_tax_subsidy_compressed_k)}</b></td><td>+${k(x.compression_gain_k)}</td></tr>`).join("")}</tbody></table>`,
      esc(iv.note) + `。建屋 ${pct(P.depreciation.capex_split.building)}（定額法 38 年）・機械 ${pct(P.depreciation.capex_split.machinery)}（定率法 10 年）の仮定${iv.from_stages ? "。invest.py の結果がないので data/leap_invest.json の段階から計算" : ""}`);
    // 5. shops
    const so = T.shops;
    const p5 = panel(`工場ごとの実効費用（${so.workscope} 1 件、税引後）`,
      `<table><thead><tr><th>順位</th><th>工場</th><th>見積もり</th><th>輸送</th><th>関税・消費税（控除不能分）</th><th>翼を離れる期間（月）</th><th>遅れの費用</th><th>税引前</th><th>税の盾（現在価値）</th><th>税引後の実効費用</th></tr></thead><tbody>${so.rows.map((x) => `<tr><td>${x.rank}</td><td>${esc(x.name)}<br><span class="hint">${x.id}・${x.currency}</span></td><td>${x.quote.toLocaleString()}</td><td>${x.transport}</td><td>${x.customs_vat}</td><td>${x.off_wing_months.toFixed(1)}（工期 ${x.tat}＋輸送 ${2 * x.transport_months}＋遅れ ${x.exp_delay_months.toFixed(2)}）</td><td>${x.delay_cost.toFixed(0)}</td><td>${x.pre_tax.toFixed(0)}</td><td>−${x.shield_pv.toFixed(0)}</td><td><b>${x.effective.toFixed(0)}</b></td></tr>`).join("")}</tbody></table>`
      + (so.no_quote.length ? `<p class="chart-note">${so.no_quote.map((x) => `${esc(x.name)}：${so.workscope} の見積もりなし（${x.workscopes.join("・")}のみ）`).join("、")}</p>` : ""),
      `k$。遅れの費用＝最短の工場より長く翼を離れる月数 × 短期リース ${so.lease_per_month} k$/月。` + esc(so.note));
    // 6. params and what to watch
    const src = (o) => o && o.source ? `${esc(o.source)} ${conf(o.confidence)}` : "";
    const rateRows = Object.entries(P.rates).map(([fy, v]) => `<tr><td>${fy}</td><td>実効税率 ${pct(v.rate, 2)}（法定 ${pct(v.corporate, 2)}＋防衛特別法人税 ${(v.defense_add * 100).toFixed(2)}pt）</td><td>${v.sources.map(src).join("<br>")}</td></tr>`).join("");
    const depRows = Object.entries(P.depreciation).map(([kk, v]) => `<tr><td>償却 ${esc(kk)}</td><td>${v.years ? `${v.years} 年 ${esc(v.method)}` : `建屋 ${pct(v.building)}／機械 ${pct(v.machinery)}`}</td><td>${src(v)}</td></tr>`).join("");
    const otherRows = [["修繕費／資本的支出", `${shares}。${esc(P.repair_vs_capital.rule)}`, src(P.repair_vs_capital)],
      ["関税（修繕のための輸出・再輸入）", "減税（控除不能分 0）", src(P.customs.repair_reimport_relief)], ["関税（航空機部品）", "無税", src(P.customs.civil_aircraft_agreement)], ["輸入消費税", "仕入税額控除で中立", src(P.customs.import_vat)],
      ["補助金", `圧縮記帳、補助率 ${pct(P.subsidy.share_assumed)} の仮定`, `${esc(P.subsidy.source)} ${conf(P.subsidy.confidence)}<br>${src(P.subsidy.share_source)}`],
      ["税効果会計", esc(P.deferred_tax.book_method_engine), `${esc(P.deferred_tax.source)} ${conf(P.deferred_tax.confidence)}`],
      ["割引率", pct(P.discount_rate), src(P.discount_rate_source)], ["予備エンジンの価値", `${P.spares.engine_value_k.toLocaleString()} k$`, src(P.spares.engine_value_source)],
      ["遅れの費用", `${P.shops.aog_lease_k_per_month} k$/月`, src(P.shops.aog_lease_source)]].map(([a, b_, c_]) => `<tr><td>${a}</td><td>${b_}</td><td>${c_}</td></tr>`).join("");
    const obs = T.observe.map((o) => `<li><b>${esc(o.what)}</b>：${esc(o.why)}（${esc(o.where)}、きっかけ：${esc(o.trigger)}）</li>`).join("");
    const p6 = panel("前提と出典", `<table><thead><tr><th>項目</th><th>値</th><th>出典・確度</th></tr></thead><tbody>${rateRows}${depRows}${otherRows}</tbody></table>`, esc(P.depreciation_simplification))
      + panel("OODA で見張る税の指標", `<ul>${obs}</ul>`, esc(T.note));
    return p1 + p2 + p3 + p4 + p5 + p6;
  }

  /* ---------------- lease redelivery ---------------- */
  const REC = { as_is: "そのまま返す", visit: "返却前に入場", extend: "延長" };
  const leaseLine = (Lz) => `リース機のエンジン ${Lz.n} 基が窓の中で返却。そのまま返すと補償 ${(Lz.total_as_is_k / 1000).toFixed(1)} 百万ドル、最善の組み合わせで ${(Lz.total_best_k / 1000).toFixed(1)}（返却前入場 ${Lz.by_recommend.visit}、そのまま ${Lz.by_recommend.as_is}、延長 ${Lz.by_recommend.extend}）`;
  function leaseChart(Lz, W = 900) {
    const E = Lz.engines, rowH = 30, L = 90, Hh = E.length * rowH + 16, mx = Math.max(1, ...E.flatMap((e) => Object.values(e.cost).filter((v) => v != null)));
    const x = (v) => L + v / mx * (W - L - 230);
    let s = "";
    E.forEach((e, i) => {
      const y = 8 + i * rowH;
      s += `<text class="lbl" x="${L - 8}" y="${y + 14}" text-anchor="end">${e.esn}</text>`;
      [["as_is", "var(--crit)"], ["visit", "var(--accent)"], ["extend", "var(--muted)"]].forEach(([k, col], j) => {
        const v = e.cost[k]; if (v == null) return;
        s += `<rect x="${L}" y="${y + j * 6}" width="${Math.max(2, x(v) - L)}" height="5" fill="${col}" opacity="${e.recommend === k ? 1 : .35}"><title>${REC[k]}：${v} k$</title></rect>`;
      });
      s += `<text class="tick" x="${W - 220}" y="${y + 14}">${REC[e.recommend]}・期限 ${esc(e.decide_by)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="リース返却の選択肢">${s}</svg>`;
  }
  function lease() {
    const Lz = C().lease;
    if (!Lz) return panel("リース返却", '<p class="hint">リース機のエンジンはありません。</p>');
    const rows = Lz.engines.map((e) => `<tr><td>${e.esn}</td><td>${esc(e.lessor)}</td><td>${e.return}</td><td>${e.planned ? `${e.planned}（${e.planned_ws}）` : "窓の外"}</td><td>${e.llp_at_return.toLocaleString()}${e.short_llp ? ` <span style="color:var(--crit)">−${e.short_llp}</span>` : ""}</td><td>${e.margin_at_return}${e.short_margin ? ` <span style="color:var(--crit)">−${e.short_margin}</span>` : ""}</td><td>${e.cost.as_is}</td><td>${e.cost.visit == null ? "—" : e.cost.visit}</td><td>${e.cost.extend}</td><td><b>${REC[e.recommend]}</b><br><span class="hint">${esc(e.visit_how)}</span></td><td>${esc(e.decide_by)}</td></tr>`).join("");
    const sim = Lz.sim && Lz.sim.visits_delta_k != null ? `<p class="chart-note">シミュレーションで：全リース機を返却前に入場させる制約で計画を解き直すと +${(Lz.sim.visits_delta_k / 1000).toFixed(1)} 百万ドル（前倒しの寿命損と混雑、欠航 ${Lz.sim.visits_aog >= 0 ? "+" : ""}${(Lz.sim.visits_aog * 100).toFixed(1)}pt）。避けられる補償 ${(Lz.total_as_is_k / 1000).toFixed(1)} と差し引きで ${(Lz.sim.visits_net_k / 1000).toFixed(1)} 百万ドル。延長は ${(Lz.sim.extend_delta_k / 1000).toFixed(1)}</p>` : "";
    return panel("", `<p class="chart-note">${esc(leaseLine(Lz))}</p>` + sim + leaseChart(Lz) + `<div class="legend"><span><span class="sw" style="background:var(--crit)"></span>そのまま返す（補償）</span><span><span class="sw" style="background:var(--accent)"></span>返却前に入場（前倒しの寿命損）</span><span><span class="sw" style="background:var(--muted)"></span>延長（延長料）</span><span>濃い＝推奨</span></div>` + G("lease"), esc(Lz.note))
      + panel("", `<table><thead><tr><th>ESN</th><th>リース会社</th><th>返却</th><th>計画の入場</th><th>返却時 LLP 残（サイクル）</th><th>返却時 EGT 余裕（℃）</th><th>そのまま（k$）</th><th>返却前入場</th><th>延長</th><th>推奨</th><th>判断期限</th></tr></thead><tbody>${rows}</tbody></table>`,
        `返却条件：LLP 残 ${Lz.terms.min_llp_cycles.toLocaleString()} サイクル以上、EGT 余裕 ${Lz.terms.min_egt_margin}℃ 以上。不足は ${Lz.terms.compensation_per_cycle_k * 1000} $/サイクル・${Lz.terms.compensation_per_degc_k} k$/℃ の補償。延長は ${Lz.terms.extension_months} か月 × ${Lz.terms.extension_rent_k_per_month} k$。通知は返却の ${Lz.terms.notice_months} か月前。`);
  }

  /* ---------------- the asset side (reserves, settlement, maintenance value) ---------------- */
  const mx4Line = (M) => `計画は ${(M.value.spend_k / 1000).toFixed(0)} 百万ドル使って整備価値 ${(M.value.value_created_k / 1000).toFixed(0)} 百万ドルを作る（${M.value.value_per_spend.toFixed(2)} ドル/ドル）。積立金：流入 ${(M.reserves.total_inflow_k / 1000).toFixed(1)}、請求 ${(M.reserves.total_claims_k / 1000).toFixed(1)}、返却で残る ${(M.settlement.reserves_forfeited_k / 1000).toFixed(1)} 百万ドル`;
  function mx4Chart(M, W = 900, H = 240, compact = false) {
    const R = M.reserves, xs = R.labels.map((_, i) => i);
    return lineChart({ xs, series: [{ ys: R.balance.map((v) => v / 1000), color: "var(--accent)" }], bars: R.outflow.map((v, i) => ({ x: i, y: v / 1000, w: compact ? 3 : 10, color: "var(--warn)", label: `${R.labels[i]} 請求 ${(v / 1000).toFixed(2)} 百万ドル` })),
      yticks: compact ? [] : [0, 2, 4, 6, 8], xticks: compact ? [] : xs.filter((i) => i % 3 === 0), xfmt: (i) => R.labels[i].slice(2), yfmt: (v) => v + " M$", ylabel: compact ? "" : "積立金残高（百万ドル）", aria: "積立金の残高と請求" }, W, H, compact);
  }
  function mx4() {
    const M = C().mx4;
    if (!M) return panel("積立金と機体価値", '<p class="hint">なし</p>');
    const V = M.value, S = M.settlement;
    const valueBars = `<svg viewBox="0 0 900 90" role="img" aria-label="整備価値"><rect x="0" y="10" width="${760 * V.now_k / Math.max(V.end_k, V.now_k)}" height="28" fill="var(--muted)"/><text class="tick" x="${760 * V.now_k / Math.max(V.end_k, V.now_k) + 8}" y="29">今 ${(V.now_k / 1000).toFixed(0)} 百万ドル</text><rect x="0" y="50" width="${760 * V.end_k / Math.max(V.end_k, V.now_k)}" height="28" fill="var(--good)"/><text class="tick" x="${760 * V.end_k / Math.max(V.end_k, V.now_k) + 8}" y="69">窓の終わり ${(V.end_k / 1000).toFixed(0)}（+${(V.value_created_k / 1000).toFixed(0)}）</text></svg>`;
    const settle = S.engines.map((e) => `<tr><td>${e.esn}</td><td>${e.return}</td><td>${e.pay_k ? e.pay_k.toFixed(0) : "—"}</td><td>${e.refund_k ? e.refund_k.toFixed(0) : "—"}</td><td>${e.reserve_left_k.toFixed(0)}</td><td>${e.net_k.toFixed(0)}</td></tr>`).join("");
    const out10 = `<table><thead><tr><th>年</th><th>入場</th><th>積立て流入（全機がリースなら）</th><th>請求</th></tr></thead><tbody>${M.outlook.map((y) => `<tr><td>${y.year}</td><td>${y.visits}</td><td>${(y.inflow_k / 1000).toFixed(0)}</td><td>${(y.claims_k / 1000).toFixed(0)}</td></tr>`).join("")}</tbody></table>`;
    return panel("", `<p class="chart-note">${esc(mx4Line(M))}</p>` + mx4Chart(M) + legend([["積立金の残高（リース機のエンジン合計）", "var(--accent)", 1], ["入場時の請求（払い戻し）", "var(--warn)"]]) + G("mx4reserves"), `料率：性能回復 ${M.reserves.rates.pr_per_fh} $/飛行時間、寿命部品 ${M.reserves.rates.llp_per_cycle} $/サイクル、値上がり ${(M.reserves.rates.escalation * 100).toFixed(0)}%/年。` + esc(M.note))
      + panel("", `<p class="chart-note">整備状態で調整したエンジン価値：${(V.now_k / 1000).toFixed(0)} → ${(V.end_k / 1000).toFixed(0)} 百万ドル（${V.n} 基）。費用 ${(V.spend_k / 1000).toFixed(0)} のうち価値になるのは ${(V.value_per_spend * 100).toFixed(0)}%</p>` + valueBars + G("mx4value"), esc(V.note))
      + panel("", `<p class="chart-note">返却時の精算：借り手が払う ${(S.pay_k / 1000).toFixed(1)}、貸し手が払い戻す ${(S.refund_k / 1000).toFixed(1)}、返却で貸し手に残る積立金 ${(S.reserves_forfeited_k / 1000).toFixed(1)} 百万ドル</p><table><thead><tr><th>ESN</th><th>返却</th><th>支払（k$）</th><th>払い戻し</th><th>残る積立金</th><th>差し引き</th></tr></thead><tbody>${settle}</tbody></table>` + G("mx4settle"), "残る積立金が大きい機は、返却前に入場して積立金を使い切る方が得なことがある（「リース返却」の出口と合わせて見る）。")
      + panel("10 年の積立金見通し（定常）", out10, "全機がリースだった場合の流入と請求。所有機には積立金はない。");
  }

  function quote() {
    const u = C().usecases;
    return panel("", `<p class="chart-note">追加作業は「延びる月数 × ${(u.value_per_engine_month * 1000).toFixed(0)} 千ドル」まで承認してよい（緑の領域なら承認）</p>` + quoteChart(u) + G("quote")
      + legend([["承認してよい上限額（線より下が承認）", "var(--good)", 1], ["例：承認が得", "var(--good)"], ["例：見送りが得", "var(--crit)"]]), `1 基が 1 か月飛ぶごとに積もる整備費（平年の整備費 ÷ 取付エンジン）を、延びる寿命の価値としています。${esc(u.quote.note)}。繁忙期をまたいで延びる、同じ機体の 2 基をずらせる、などの価値は含まない。`);
  }

  function trendLine(u) {
    const t = u.trend, r = t.remove_now, w = t.cases["要監視のエンジン"].wait, wp = t.cases["要監視のエンジン"].wait_peak;
    const k = w.findIndex((v, i) => i > 0 && v < r[i]);            // from here on, waiting is cheaper
    const peakAlways = wp.every((v, i) => i === 0 || v >= r[i]);
    return (k > 0 ? `要監視のエンジンは、残りの余裕が ${k} か月未満なら今下ろし、それ以上なら様子を見るほうが得` : "要監視のエンジンは警報が出たら今下ろすほうが得")
      + (peakAlways ? "（繁忙期にかかるなら常に下ろす）" : "");
  }
  function trendChart(u, W = 900, H = 320, compact = false) {
    const t = u.trend, c = t.cases;
    return lineChart({ xs: t.months, series: [
      { ys: t.remove_now, color: "var(--accent)", label: "今下ろす：失う飛べる寿命" },
      { ys: c["通常のエンジン"].wait, color: "var(--good)", dash: "5 4", label: "待つ：通常のエンジン（故障率 月 1%）" },
      { ys: c["要監視のエンジン"].wait, color: "var(--warn)", label: "待つ：要監視（月 6%）" },
      { ys: c["要監視のエンジン"].wait_peak, color: "var(--crit)", label: "待つ：要監視・繁忙期にかかる" }],
      points: compact ? [] : (() => { const r = t.remove_now, w = c["要監視のエンジン"].wait, k = w.findIndex((x, i) => i > 0 && x < r[i]); return k > 0 ? [{ x: k, y: r[k], color: "var(--ink)", label: `ここから先は待つほうが得（要監視・${k} か月）` }] : []; })(),
      yticks: [0, 0.5, 1, 1.5], xticks: [0, 3, 6, 9, 12], yfmt: (v) => v + " M$", xlabel: "あと何か月飛ばすか（残りの余裕）", ylabel: "見込みの損（百万ドル）", aria: "警報時の判断" }, W, H, compact);
  }
  function trend() {
    const u = C().usecases;
    return panel("", `<p class="chart-note">${trendLine(u)}。通常のエンジンは待つほうが得</p>` + trendChart(u) + G("trend")
      + legend([["今下ろすと失う寿命", "var(--accent)", 1], ["待つ：通常", "var(--good)", 1], ["待つ：要監視", "var(--warn)", 1], ["待つ：要監視・繁忙期", "var(--crit)", 1]]), esc(u.trend.note));
  }

  const sparesCur = (u) => u.spares.curves["今の工期"][u.spares.have];
  const sparesCls = (u) => (sparesCur(u) < 0.9 ? "warn" : "ok");
  const sparesLine = (u) => `予備 ${u.spares.have} 基で足りる確率：今の工期 ${Math.round(sparesCur(u) * 100)}%、混雑が 2 か月延びると ${Math.round(u.spares.curves["混雑がさらに 2 か月"][u.spares.have] * 100)}%`;
  function sparesChart(u, W = 900, H = 320, compact = false) {
    const sp = u.spares, cols = ["var(--good)", "var(--accent)", "var(--crit)"];
    return lineChart({ xs: sp.spares, series: Object.entries(sp.curves).map(([k, ys], i) => ({ ys: ys.map((v) => v * 100), color: cols[i], label: k })),
      points: compact ? [] : [{ x: sp.have, y: sp.curves["今の工期"][sp.have] * 100, color: "var(--accent)", label: `今の予備・今の工期 → ${Math.round(sp.curves["今の工期"][sp.have] * 100)}%` }, { x: sp.have, y: sp.curves["混雑がさらに 2 か月"][sp.have] * 100, color: "var(--crit)", label: `混雑が延びると → ${Math.round(sp.curves["混雑がさらに 2 か月"][sp.have] * 100)}%` }],
      vlines: [{ x: sp.have, color: "var(--ink)", label: `今の予備 ${sp.have} 基` }, { x: sp.rule_10pct, color: "var(--muted)", dash: "4 3", label: "業界の目安 10%", dy: 14 }],
      yticks: [0, 50, 90, 100], xticks: [0, 5, 10, 15, 20, 25], yfmt: (v) => v + "%", xlabel: "予備エンジンの数（取付の最大を超えて持つ基数）", ylabel: "足りる確率", aria: "予備エンジンの数" }, W, H, compact);
  }
  function spares() {
    const u = C().usecases, sp = u.spares;
    return panel("", `<p class="chart-note">${sparesLine(u)}</p>` + sparesChart(u) + G("spares") + legend(Object.keys(sp.curves).map((k, i) => [`${k}（工場側に平均 ${sp.mean_off[k].toFixed(1)} 基）`, ["var(--good)", "var(--accent)", "var(--crit)"][i], 1])), esc(sp.note) + "業界の目安（取付の 10%）は、工期が長い今は足りない側に出ます。")
      + panel("", `<p class="chart-note">${sparesCostLine(u)}</p>` + sparesCostChart(u) + G("sparescost") + legend([["持つ費用（1 基ごとに増える）", "var(--warn)", 1], ["足りない損（リース・運休、予備が増えると減る）", "var(--accent)", 1], ["合計：今の工期", "var(--ink)", 1], ["合計：平常の工期", "var(--good)", 1], ["合計：混雑が 2 か月延びる", "var(--crit)", 1]]), esc(sp.note_cost));
  }
  const sparesCostLine = (u) => { const c = u.spares.cost, h = u.spares.have, now = c["今の工期"], nor = c["平常（工期 4 か月）"], con = c["混雑がさらに 2 か月"];
    const verdict = h > now.best ? `今の工期でも ${h - now.best} 基多く、年 ${now.excess_cost.toFixed(1)} 百万ドル余分` : h < now.best ? `今の工期では ${now.best - h} 基足りない` : "今の工期ではちょうどよい";
    return `ちょうどよい予備は、平常 ${nor.best} 基・今 ${now.best} 基・混雑 ${con.best} 基。今の ${h} 基は、${verdict}。工期が平常に戻ると年 ${nor.excess_cost.toFixed(1)} 百万ドルの持ちすぎ`; };
  function sparesCostChart(u, W = 900, H = 320) {
    const sp = u.spares, c = sp.cost, now = c["今の工期"], xs = sp.spares.slice(0, 21);
    const cut = (a) => a.slice(0, 21);
    return lineChart({ xs, series: [
      { ys: cut(now.hold), color: "var(--warn)", label: "持つ費用" }, { ys: cut(now.short), color: "var(--accent)", label: "足りない損（今の工期）" },
      { ys: cut(now.total), color: "var(--ink)", label: "合計（今の工期）" },
      { ys: cut(c["平常（工期 4 か月）"].total), color: "var(--good)", dash: "5 4", label: "合計（平常）" },
      { ys: cut(c["混雑がさらに 2 か月"].total), color: "var(--crit)", dash: "5 4", label: "合計（混雑）" }],
      ymax: 0, points: [{ x: now.best, y: now.total[now.best], color: "var(--ink)", label: `今の工期で最も安い ${now.best} 基` },
        { x: c["平常（工期 4 か月）"].best, y: c["平常（工期 4 か月）"].total[c["平常（工期 4 か月）"].best], color: "var(--good)", label: `平常なら ${c["平常（工期 4 か月）"].best} 基` }],
      vlines: [{ x: sp.have, color: "var(--muted)", dash: "3 3", label: `今の予備 ${sp.have} 基` }],
      yticks: [0, 10, 20, 30], xticks: [0, 5, 10, 15, 20], yfmt: (v) => v + " M$", xlabel: "予備エンジンの数", ylabel: "年間の費用（百万ドル）", aria: "予備の持ちすぎと不足の費用" }, W, H, false);
  }

  const offerLine = (u) => { const o = u.offer, i = o.cycles.indexOf(o.market.cycles); return `残り ${o.market.cycles.toLocaleString()} 回のエンジンは ${o.max_price[i].toFixed(1)} 百万ドルまでなら買い（相場 ${o.market.low}〜${o.market.high}）`; };
  function offerChart(u, W = 900, H = 320, compact = false) {
    const o = u.offer;
    return lineChart({ xs: o.cycles, series: [{ ys: o.max_price, color: "var(--accent)", label: "上限価格" }, { ys: o.max_price_peak, color: "var(--good)", dash: "5 4", label: "繁忙期の前に届く場合" }],
      bands: [{ x0: o.market.cycles - 700, x1: o.market.cycles + 700, y0: o.market.low, y1: o.market.high, color: "var(--warn)", label: o.market.source }],
      yticks: [0, 2, 4, 6, 8, 10], xticks: [0, 4000, 8000, 12000, 16000], xfmt: (v) => (v / 1000) + "k", yfmt: (v) => v + " M$", xlabel: "残りの飛行回数", ylabel: "払ってよい上限（百万ドル）", aria: "打診の上限価格" }, W, H, compact);
  }
  function offer() {
    const u = C().usecases;
    return panel("", `<p class="chart-note">${offerLine(u)}</p>` + offerChart(u) + G("offer") + legend([["上限価格", "var(--accent)", 1], ["繁忙期の前に届く場合", "var(--good)", 1], ["ハーフライフの相場（IBA 2025）", "var(--warn)"]]), esc(u.offer.note) + "。記録の欠け、推力の型、載せ替え費用は別に差し引く。");
  }

  const cashLine = (u) => `2 年の支払い ${u.cash.cum.at(-1).toFixed(0)} 百万ドル（予算 ${u.cash.cum_budget.at(-1).toFixed(0)}）。円では ${Math.round(u.cash.yen_oku.low)}〜${Math.round(u.cash.yen_oku.high)} 億円`;
  function cashChart(u, W = 900, H = 320, compact = false) {
    const c = u.cash, xs = c.labels.map((_, i) => i), bw = (W - 70) / xs.length * 0.6;
    return lineChart({ xs, series: [{ ys: c.cum, color: "var(--ink)", label: "支払いの累計" }, { ys: c.cum_budget, color: "var(--crit)", dash: "5 4", label: "予算の累計（季節で按分）" }],
      bars: c.pay.map((v, i) => ({ x: i, y: v, w: compact ? 3 : bw, color: "var(--accent)", label: `${c.labels[i]} 支払い ${v.toFixed(1)} 百万ドル` })),
      yticks: [0, 100, 200, 300], xticks: [0, 6, 12, 18, 23], xfmt: (i) => c.labels[i].slice(2), yfmt: (v) => v + " M$", xlabel: "月", ylabel: "百万ドル", aria: "支払い" }, W, H, compact);
  }
  function cash() {
    const u = C().usecases;
    return panel("", `<p class="chart-note">${cashLine(u)}</p>` + cashChart(u) + G("cash") + legend([["月ごとの支払い", "var(--accent)"], ["支払いの累計", "var(--ink)", 1], ["予算の累計", "var(--crit)", 1]]), esc(u.cash.note) + "。戻りの月に支払いが集中するので、入場の山より数か月遅れて支払いの山が来る。");
  }

  const relLine = (u) => `予定外取卸し率 ${u.reliability.mean.toFixed(3)}（1,000 時間あたり）、警戒値 ${u.reliability.alert.toFixed(3)} を超えた月 ${u.reliability.above}`;
  function relChart(u, W = 900, H = 320, compact = false) {
    const r = u.reliability, xs = r.labels.map((_, i) => i);
    return lineChart({ xs, series: [{ ys: r.uer_3m, color: "var(--accent)", label: "3 か月移動平均" }],
      hlines: [{ y: r.alert, color: "var(--crit)", dash: "5 4", label: "警戒値（平均＋3σ）" }, { y: r.mean, color: "var(--muted)", dash: "2 3", label: "平均" }],
      yticks: [0, 0.05, 0.1], xticks: [0, 12, 24, 35], xfmt: (i) => r.labels[i].slice(2), xlabel: "月（直近 3 年）", ylabel: "予定外取卸し / 1,000 時間", aria: "信頼性の管理図" }, W, H, compact);
  }
  function reliability() {
    const u = C().usecases;
    return panel("", `<p class="chart-note">${relLine(u)}</p>` + relChart(u) + G("reliability") + legend([["3 か月移動平均", "var(--accent)", 1], ["警戒値", "var(--crit)", 1], ["平均", "var(--muted)", 1]]), esc(u.reliability.note) + `。予定外を含む入場全体は 1,000 時間あたり ${u.reliability.svr_per_1000.toFixed(3)}。`);
  }

  function roleLine(c) {
    const u = c.usecases;
    return ({ exec: c.verdict[0].a, fin: cashLine(u), ops: sparesLine(u), plan: `${c.verdict[2].a}。${trendLine(u)}`, proc: offerLine(u), tech: relLine(u) })[role] || "";
  }

  /* ---------------- level 3 ---------------- */
  function engines() {
    const c = C();
    return panel("", `<p class="chart-note">${c.plan.length} 基の予定</p>` + gantt(c) + ganttLegend + G("gantt"), "バーにマウスを載せると、工場・費用・判断期限の理由が出ます。");
  }

  /* ---------------- level 4 ---------------- */
  function sources() {
    const c = C();
    const flat = [];
    const walk = (k, v) => { if (v && typeof v === "object") Object.entries(v).forEach(([kk, vv]) => walk(`${k} / ${kk}`, vv)); else if (v) flat.push([k, v]); };
    Object.entries(c.sources).forEach(([k, v]) => walk(k, v));
    const cats = {};
    flat.forEach(([k]) => { const g = k.split(" / ")[0]; cats[g] = cats[g] || [0, 0]; cats[g][0]++; });
    c.unsourced.forEach((u) => { const g = u.where.split(".")[1] || u.where; cats[g] = cats[g] || [0, 0]; cats[g][1]++; });
    const E = Object.entries(cats), W = 560, rowH = 22, L = 110, H = E.length * rowH + 10, top = Math.max(...E.map(([, v]) => v[0] + v[1]));
    let s = "";
    E.forEach(([g, [a, b]], i) => { const y = 4 + i * rowH, x = (v) => L + v / top * (W - L - 20); s += `<text class="lbl" x="${L - 8}" y="${y + 13}" text-anchor="end">${esc(g)}</text><rect x="${L}" y="${y + 2}" width="${x(a) - L}" height="14" fill="var(--good)"/><rect x="${x(a)}" y="${y + 2}" width="${x(a + b) - x(a)}" height="14" fill="var(--warn)"/>`; });
    const link = (t) => esc(t).replace(/(https?:\/\/[^\s）)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    return panel("", `<p class="chart-note">どこまで根拠があるか（緑＝出典あり、黄＝出典なし）</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="出典の有無">${s}</svg>` + G("sources"))
      + `<details class="panel"><summary>出典の一覧</summary><div class="scroll"><table><tbody>${flat.map(([k, v]) => `<tr><td class="mono" style="white-space:nowrap">${esc(k)}</td><td class="src">${link(v)}</td></tr>`).join("")}</tbody></table></div></details>`
      + `<details class="panel"><summary>出典のない数字（${c.unsourced.length} 件）</summary><div class="scroll"><table><tbody>${c.unsourced.map((u) => `<tr><td class="mono" style="white-space:nowrap">${esc(u.where)}</td><td class="src">${esc(u.what)}</td></tr>`).join("")}</tbody></table></div></details>`;
  }

  render();
})();
</script>
