<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>シミュレーションの構造</title>
<style>body{margin:0;background:#f6f4ee;color:#141413;font-family:"IBM Plex Sans JP",system-ui,sans-serif}main{max-width:1240px;margin:0 auto;padding:24px}h1{font-size:22px;margin:0 0 6px}h2{font-size:16px;margin:24px 0 6px}p{font-size:13px;color:#5b5a55;margin:0 0 8px}</style></head>
<body><main><h1>「1 回のシミュレーション」の中身（購入計画の輪、JAL）</h1><p>外から内へ：輪（手を 4 回）→ 機隊の構成（17 通り）→ 世界（2 つ）→ 計画を 1 回解く → 800 本で評価。乱数の種は 1 つだった。</p><svg viewBox="0 0 1200 600" font-family="IBM Plex Sans JP, sans-serif"><rect x="20" y="20" width="1160" height="560" rx="8" fill="#f6f4ee" stroke="#1f3d63" stroke-width="1.5"/><text x="34" y="46" font-size="15" font-weight="700" fill="#141413">購入計画の輪（JAL）＝ 手を 4 回進めた</text><text x="34" y="68" font-size="12" fill="#5b5a55">各手で候補 4 つを試す → 合計 17 の機隊構成</text><rect x="50" y="80" width="1100" height="470" rx="8" fill="#ffffff" stroke="#1f3d63" stroke-width="1.5"/><text x="64" y="106" font-size="15" font-weight="700" fill="#141413">1 つの機隊構成（例：中寿命機 4 基＋プール +2）</text><text x="64" y="128" font-size="12" fill="#5b5a55">世界 2 つ（基準・逼迫）で同じことをする</text><rect x="80" y="140" width="520" height="390" rx="8" fill="#eef2f7" stroke="#1f3d63" stroke-width="1.5"/><text x="94" y="166" font-size="15" font-weight="700" fill="#141413">世界＝基準</text><rect x="100" y="190" width="480" height="120" rx="8" fill="#ffffff" stroke="#1f3d63" stroke-width="1.5"/><text x="114" y="216" font-size="15" font-weight="700" fill="#141413">① 計画を解く（1 回）</text><text x="114" y="238" font-size="12" fill="#5b5a55">MILP：40 本のシナリオを標本平均で最適化。どの機を・いつ・どこへ</text><text x="340" y="330" text-anchor="middle" font-size="18" fill="#1f3d63">↓ 解いた計画を</text><rect x="100" y="345" width="480" height="160" rx="8" fill="#ffffff" stroke="#1f3d63" stroke-width="1.5"/><text x="114" y="371" font-size="15" font-weight="700" fill="#141413">② 評価する（800 本のモンテカルロ）</text><text x="114" y="393" font-size="12" fill="#5b5a55">乱数：工場の遅れ・所見の超過・計画外取卸し・キット納期</text><text x="120" y="430" font-size="12" fill="#141413">→ 期待費用、悪い 1 割、欠航確率（800 本のうち足りない月が出た割合）</text><text x="120" y="455" font-size="12" fill="#a23b2a">乱数の種は 42 の 1 つだけ（今日までの輪）</text><text x="120" y="478" font-size="12" fill="#2f5d3a">→ 種を 5 つに変えて回し直した結果が下の図</text><rect x="620" y="140" width="520" height="390" rx="8" fill="#f3ede2" stroke="#1f3d63" stroke-width="1.5"/><text x="634" y="166" font-size="15" font-weight="700" fill="#141413">世界＝逼迫（キット 12 か月）</text><rect x="640" y="190" width="480" height="120" rx="8" fill="#ffffff" stroke="#1f3d63" stroke-width="1.5"/><text x="654" y="216" font-size="15" font-weight="700" fill="#141413">① 計画を解く（1 回）</text><text x="654" y="238" font-size="12" fill="#5b5a55">MILP：40 本のシナリオを標本平均で最適化。どの機を・いつ・どこへ</text><text x="880" y="330" text-anchor="middle" font-size="18" fill="#1f3d63">↓ 解いた計画を</text><rect x="640" y="345" width="480" height="160" rx="8" fill="#ffffff" stroke="#1f3d63" stroke-width="1.5"/><text x="654" y="371" font-size="15" font-weight="700" fill="#141413">② 評価する（800 本のモンテカルロ）</text><text x="654" y="393" font-size="12" fill="#5b5a55">乱数：工場の遅れ・所見の超過・計画外取卸し・キット納期</text><text x="660" y="430" font-size="12" fill="#141413">→ 期待費用、悪い 1 割、欠航確率（800 本のうち足りない月が出た割合）</text><text x="660" y="455" font-size="12" fill="#a23b2a">乱数の種は 42 の 1 つだけ（今日までの輪）</text><text x="660" y="478" font-size="12" fill="#2f5d3a">→ 種を 5 つに変えて回し直した結果が下の図</text></svg>
<h2>輪の軌跡と、種を変えたときの散らばり</h2><svg viewBox="0 0 1200 320" font-family="IBM Plex Sans JP, sans-serif"><line x1="70" x2="1040" y1="198.0" y2="198.0" stroke="#a23b2a" stroke-dasharray="5 4"/><text x="1120" y="202.0" font-size="12" fill="#a23b2a">目標 5%</text><text x="62" y="244.0" text-anchor="end" font-size="11" fill="#5b5a55">0%</text><line x1="70" x2="1040" y1="240.0" y2="240.0" stroke="#e5e1d6"/><text x="62" y="202.0" text-anchor="end" font-size="11" fill="#5b5a55">5%</text><line x1="70" x2="1040" y1="198.0" y2="198.0" stroke="#e5e1d6"/><text x="62" y="160.0" text-anchor="end" font-size="11" fill="#5b5a55">10%</text><line x1="70" x2="1040" y1="156.0" y2="156.0" stroke="#e5e1d6"/><text x="62" y="118.0" text-anchor="end" font-size="11" fill="#5b5a55">15%</text><line x1="70" x2="1040" y1="114.0" y2="114.0" stroke="#e5e1d6"/><text x="62" y="76.0" text-anchor="end" font-size="11" fill="#5b5a55">20%</text><line x1="70" x2="1040" y1="72.0" y2="72.0" stroke="#e5e1d6"/><text x="62" y="34.0" text-anchor="end" font-size="11" fill="#5b5a55">25%</text><line x1="70" x2="1040" y1="30.0" y2="30.0" stroke="#e5e1d6"/><polyline fill="none" stroke="#1f3d63" stroke-width="2.5" points="70.0,56.464206093641124 302.5,77.7402600941056 535.0,140.84416893734033 767.5,183.1686722813879 1000.0,220.0914391875145"/><circle cx="70.0" cy="56.464206093641124" r="6" fill="#1f3d63"/><text x="70.0" y="258" text-anchor="middle" font-size="12" fill="#141413">今</text><text x="80.0" y="46.464206093641124" font-size="12" fill="#1f3d63">21.8%</text><circle cx="302.5" cy="77.7402600941056" r="6" fill="#1f3d63"/><text x="302.5" y="258" text-anchor="middle" font-size="12" fill="#141413">midlife+2</text><text x="312.5" y="67.7402600941056" font-size="12" fill="#1f3d63">19.3%</text><circle cx="535.0" cy="140.84416893734033" r="6" fill="#1f3d63"/><text x="535.0" y="258" text-anchor="middle" font-size="12" fill="#141413">midlife+2</text><text x="545.0" y="130.84416893734033" font-size="12" fill="#1f3d63">11.8%</text><circle cx="767.5" cy="183.1686722813879" r="6" fill="#1f3d63"/><text x="767.5" y="258" text-anchor="middle" font-size="12" fill="#141413">pool+1</text><text x="777.5" y="173.1686722813879" font-size="12" fill="#1f3d63">6.8%</text><circle cx="1000.0" cy="220.0914391875145" r="6" fill="#1f3d63"/><text x="1000.0" y="258" text-anchor="middle" font-size="12" fill="#141413">pool+1</text><text x="1010.0" y="210.0914391875145" font-size="12" fill="#1f3d63">2.4%</text><circle cx="1028.0" cy="219.63840000000002" r="5" fill="#2f5d3a" opacity=".85"><title>種 1: 2.4%</title></circle><circle cx="1038.0" cy="234.4896" r="5" fill="#2f5d3a" opacity=".85"><title>種 2: 0.7%</title></circle><circle cx="1048.0" cy="220.0752" r="5" fill="#2f5d3a" opacity=".85"><title>種 3: 2.4%</title></circle><circle cx="1058.0" cy="216.2784" r="5" fill="#2f5d3a" opacity=".85"><title>種 4: 2.8%</title></circle><circle cx="1068.0" cy="218.9664" r="5" fill="#2f5d3a" opacity=".85"><title>種 5: 2.5%</title></circle><text x="988.0" y="254.2784" font-size="12" fill="#2f5d3a">種 1〜5 の最終案：0.7〜2.8%</text><text x="70" y="282" font-size="12" fill="#5b5a55">横：輪の手（足したもの）。縦：欠航確率の期待値（基準 52%・逼迫 48% で重みづけ）。青は種 42 の 1 通り、緑は種 1〜5。</text></svg>
<p>読み方：青い線は種 42 で得た欠航確率。最終案を種 1〜5 で回し直すと 0.7〜2.8% に散る（±1pt）。目標 5% との差は十分あるので結論は変わらないが、途中の 6.8% → 4.4% のような 1〜2 点の差はこの幅の中。</p></main></body></html>
