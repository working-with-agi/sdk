<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>body{margin:0;background:#fbfbfd}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1370" width="1400" height="1370" font-family="IBM Plex Sans JP, sans-serif"><rect width="1400" height="1370" fill="#fbfbfd"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#be123c"/></marker></defs><rect x="20" y="16" width="85.91999999999999" height="24" rx="6" fill="#047857"/><text x="62.959999999999994" y="33" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P2 詳細計画</text><text x="113.91999999999999" y="35" font-size="21" font-weight="700" fill="#0f172a">詳細計画：月ごとに実績を入れて基本計画を補正する（月次〜当日）</text><text x="20" y="60" font-size="12" fill="#64748b">左から右へ：実績を入れる → 見張りと追跡で補正する → 週次の先行指標 → 当日はルールで動く。色と枠は P1 と同じ。青緑の札＝基本計画（P1）との接続。</text><rect x="232.0" y="76" width="283.0" height="30" rx="6" fill="#1e293b"/><text x="375.5" y="96" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">① 実績を入れる（月 1 回）</text><rect x="519.0" y="76" width="283.0" height="30" rx="6" fill="#1e293b"/><text x="662.5" y="96" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">② 見張りと追跡（月 1 回・数十秒）</text><rect x="806.0" y="76" width="283.0" height="30" rx="6" fill="#1e293b"/><text x="949.5" y="96" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">③ 週次（先行指標）</text><rect x="1093.0" y="76" width="283.0" height="30" rx="6" fill="#1e293b"/><text x="1236.5" y="96" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">④ 当日〜数日（計算なし）</text><rect x="20" y="118.0" width="1360" height="183.33333333333334" fill="#ffffff" stroke="#e2e8f0"/><text x="30" y="211.66666666666669" font-size="12" font-weight="700" fill="#0f172a">経営（承認・投資）</text><rect x="20" y="305.33333333333337" width="1360" height="183.33333333333334" fill="#f1f3f8" stroke="#e2e8f0"/><text x="30" y="399.00000000000006" font-size="12" font-weight="700" fill="#0f172a">整備計画（計画・追跡）</text><rect x="20" y="492.6666666666667" width="1360" height="183.33333333333334" fill="#ffffff" stroke="#e2e8f0"/><text x="30" y="586.3333333333334" font-size="12" font-weight="700" fill="#0f172a">調達・契約（工場・部品・購入）</text><rect x="20" y="680.0" width="1360" height="183.33333333333334" fill="#f1f3f8" stroke="#e2e8f0"/><text x="30" y="773.6666666666666" font-size="12" font-weight="700" fill="#0f172a">運航・機材（便の計画・退役）</text><rect x="20" y="867.3333333333334" width="1360" height="183.33333333333334" fill="#ffffff" stroke="#e2e8f0"/><text x="30" y="961.0" font-size="12" font-weight="700" fill="#0f172a">技術（状態・劣化）</text><rect x="20" y="1054.6666666666667" width="1360" height="183.33333333333334" fill="#f1f3f8" stroke="#e2e8f0"/><text x="30" y="1148.3333333333335" font-size="12" font-weight="700" fill="#0f172a">財務（予算・税・資産）</text><rect x="20" y="1252" width="52" height="16" rx="4" fill="#be123c"/><text x="46" y="1264" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">E</text><text x="80" y="1264" font-size="11.5" fill="#0f172a">月次の輪：判断材料 → 見直し → 承認 → 追跡。人の判断の輪で、計算は数十秒。</text><rect x="20" y="1270" width="52" height="16" rx="4" fill="#be123c"/><text x="46" y="1282" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">C</text><text x="80" y="1282" font-size="11.5" fill="#0f172a">年次の輪：追跡の事後確率と実績の重みで前提を補正し、P1 の「世界と重み」へ戻す（年 1 回、過去 8 版で検証済み）。</text><rect x="20" y="1288" width="52" height="16" rx="4" fill="#be123c"/><text x="46" y="1300" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">B</text><text x="80" y="1300" font-size="11.5" fill="#0f172a">見張り：月 1 回、在庫の機の遅れ・予定入場・故障を 4,000 本で引く。3 か月先 AOG > 5% なら短期リースを積み、年次を待たずに P1 の購入の輪を回す。</text><rect x="20" y="1306" width="52" height="16" rx="4" fill="#1e293b"/><text x="46" y="1318" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">週次／当日</text><text x="80" y="1318" font-size="11.5" fill="#0f172a">週次は先行指標（納期回答の変化点）だけを計算し、当日はルール（承認線・警報・上限）で動く。感覚値：月次の補正は ±1〜2 基の予備と 1〜2 件の入場前後。</text><rect x="20" y="1324" width="52" height="16" rx="4" fill="#0e7490"/><text x="46" y="1336" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">P1 接続</text><text x="80" y="1336" font-size="11.5" fill="#0f172a">基本計画（年次〜半期）との受け渡し。基準計画を受け取り、学習と見張りの結果を返す。乱数の種 5 つで AOG ±1pt。すべて合成データの目安。</text><rect x="519.0" y="122.0" width="857.0" height="90.0" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><rect x="519.0" y="309.33333333333337" width="283.0" height="174.0" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><rect x="519.0" y="496.6666666666667" width="283.0" height="90.00000000000006" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><rect x="806.0" y="309.33333333333337" width="283.0" height="277.33333333333337" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><rect x="1093.0" y="309.33333333333337" width="283.0" height="277.33333333333337" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><polyline fill="none" points="507.0,160.0 513.0,160.0 513.0,160.0 527.0,160.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,347.33333333333337 513.0,347.33333333333337 513.0,347.33333333333337 527.0,347.33333333333337" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="660.5,377.33333333333337 660.5,401.33333333333337" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="814.0,347.33333333333337 808.0,347.33333333333337 808.0,347.33333333333337 794.0,347.33333333333337" stroke="#334155" stroke-width="1.6" marker-end= stroke-width="1.5"/><text x="249.0" y="334.33333333333337" font-size="12" font-weight="700" fill="#0f172a">計画との差（planned vs actual）</text><text x="249.0" y="351.33333333333337" font-size="10.5" fill="#0f172a">入場月・整備範囲・費用の差分</text><text x="249.0" y="367.33333333333337" font-size="10.5" fill="#64748b">差が続けば追跡の重みに効く</text><rect x="527.0" y="317.33333333333337" width="267.0" height="60" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="536.0" y="334.33333333333337" font-size="12" font-weight="700" fill="#0f172a">追跡・確率の更新（track）</text><text x="536.0" y="351.33333333333337" font-size="10.5" fill="#0f172a">1. 世界 5 の事後確率を更新（γ=0.5 で緩める）</text><text x="536.0" y="367.33333333333337" font-size="10.5" fill="#64748b">2. ΔV を出し 3. ヒステリシス K=300 k$／2 か月</text><rect x="527.0" y="401.33333333333337" width="267.0" height="60" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="536.0" y="418.33333333333337" font-size="12" font-weight="700" fill="#0f172a">次の版への学習（roll）</text><text x="536.0" y="435.33333333333337" font-size="10.5" fill="#0f172a">実績の重み n/(n+K)。変化点なら古い分を捨てる</text><text x="536.0" y="451.33333333333337" font-size="10.5" fill="#64748b">入場時期・計画外率・据置確率を補正</text><rect x="814.0" y="317.33333333333337" width="267.0" height="60" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="823.0" y="334.33333333333337" font-size="12" font-weight="700" fill="#0f172a">変化点検知（cpd）</text><text x="823.0" y="351.33333333333337" font-size="10.5" fill="#0f172a">BOCPD・CUSUM で納期回答の流れを見張る</text><text x="823.0" y="367.33333333333337" font-size="10.5" fill="#64748b">検知したら「観測世界」を足す</text><rect x="1101.0" y="317.33333333333337" width="267.0" height="60" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="1110.0" y="334.33333333333337" font-size="12" font-weight="700" fill="#0f172a">暗黙のルール（ooda）</text><text x="1110.0" y="351.33333333333337" font-size="10.5" fill="#0f172a">承認線 v・警報・戻り遅れ。その場で判断</text><text x="1110.0" y="367.33333333333337" font-s
