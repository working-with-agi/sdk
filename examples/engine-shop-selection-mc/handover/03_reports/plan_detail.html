<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>body{margin:0;background:#fbfbfd}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1470" width="1400" height="1470" font-family="IBM Plex Sans JP, sans-serif"><rect width="1400" height="1470" fill="#fbfbfd"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#be123c"/></marker></defs><rect x="20" y="16" width="85.91999999999999" height="24" rx="6" fill="#047857"/><text x="62.959999999999994" y="33" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P2 詳細計画</text><text x="113.91999999999999" y="35" font-size="21" font-weight="700" fill="#0f172a">詳細計画：月ごとに実績を入れて基本計画を補正する（月次〜当日）</text><text x="20" y="60" font-size="12" fill="#64748b">左から右へ：実績を入れる → 見張りと追跡で補正する → 週次の先行指標 → 当日はルールで動く。色と枠は P1 と同じ。青緑の札＝基本計画（P1）との接続。</text><rect x="232.0" y="74" width="283.0" height="46" rx="6" fill="#1e293b"/><text x="375.5" y="93" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">① 実績を入れる（月 1 回）</text><rect x="328.86" y="100" width="93.28000000000002" height="16" rx="8" fill="#0f766e"/><text x="375.5" y="112" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="700">OODA：Observe</text><rect x="519.0" y="74" width="283.0" height="46" rx="6" fill="#1e293b"/><text x="662.5" y="93" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">② 見張りと追跡（月 1 回・数十秒）</text><rect x="589.4" y="100" width="146.20000000000005" height="16" rx="8" fill="#0f766e"/><text x="662.5" y="112" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="700">OODA：Orient → Decide</text><rect x="806.0" y="74" width="283.0" height="46" rx="6" fill="#1e293b"/><text x="949.5" y="93" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">③ 週次（先行指標）</text><rect x="873.355" y="100" width="152.29000000000005" height="16" rx="8" fill="#0f766e"/><text x="949.5" y="112" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="700">OODA：Observe → Orient</text><rect x="1093.0" y="74" width="283.0" height="46" rx="6" fill="#1e293b"/><text x="1236.5" y="93" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">④ 当日〜数日（計算なし）</text><rect x="1172.535" y="100" width="127.93000000000004" height="16" rx="8" fill="#0f766e"/><text x="1236.5" y="112" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="700">OODA：Decide → Act</text><rect x="20" y="130.0" width="1360" height="190.0" fill="#ffffff" stroke="#e2e8f0"/><text x="30" y="227.0" font-size="12" font-weight="700" fill="#0f172a">経営（承認・投資）</text><rect x="20" y="324.0" width="1360" height="190.0" fill="#f1f3f8" stroke="#e2e8f0"/><text x="30" y="421.0" font-size="12" font-weight="700" fill="#0f172a">整備計画（計画・追跡）</text><rect x="20" y="518.0" width="1360" height="190.0" fill="#ffffff" stroke="#e2e8f0"/><text x="30" y="615.0" font-size="12" font-weight="700" fill="#0f172a">調達・契約（工場・部品・購入）</text><rect x="20" y="712.0" width="1360" height="190.0" fill="#f1f3f8" stroke="#e2e8f0"/><text x="30" y="809.0" font-size="12" font-weight="700" fill="#0f172a">運航・機材（便の計画・退役）</text><rect x="20" y="906.0" width="1360" height="190.0" fill="#ffffff" stroke="#e2e8f0"/><text x="30" y="1003.0" font-size="12" font-weight="700" fill="#0f172a">技術（状態・劣化）</text><rect x="20" y="1100.0" width="1360" height="190.0" fill="#f1f3f8" stroke="#e2e8f0"/><text x="30" y="1197.0" font-size="12" font-weight="700" fill="#0f172a">財務（予算・税・資産）</text><rect x="20" y="1306" width="52" height="16" rx="4" fill="#be123c"/><text x="46" y="1318" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">E</text><text x="80" y="1318" font-size="11.5" fill="#0f172a">月次の輪：判断材料 → 見直し → 承認 → 追跡。人の判断の輪で、計算は数十秒。</text><rect x="20" y="1324" width="52" height="16" rx="4" fill="#be123c"/><text x="46" y="1336" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">C</text><text x="80" y="1336" font-size="11.5" fill="#0f172a">年次の輪：追跡の事後確率と実績の重みで前提を補正し、P1 の「世界と重み」へ戻す（年 1 回、過去 8 版で検証済み）。</text><rect x="20" y="1342" width="52" height="16" rx="4" fill="#be123c"/><text x="46" y="1354" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">B</text><text x="80" y="1354" font-size="11.5" fill="#0f172a">見張り：月 1 回、在庫の機の遅れ・予定入場・故障を 4,000 本で引く。3 か月先 AOG > 5% なら短期リースを積み、年次を待たずに P1 の購入の輪を回す。</text><rect x="20" y="1360" width="52" height="16" rx="4" fill="#1e293b"/><text x="46" y="1372" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">週次／当日</text><text x="80" y="1372" font-size="11.5" fill="#0f172a">週次は先行指標（納期回答の変化点）だけを計算し、当日はルール（承認線・警報・上限）で動く。感覚値：月次の補正は ±1〜2 基の予備と 1〜2 件の入場前後。</text><rect x="20" y="1378" width="52" height="16" rx="4" fill="#0f766e"/><text x="46" y="1390" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">OODA</text><text x="80" y="1390" font-size="11.5" fill="#0f172a">このページは OODA。Observe＝実績・回答ログ・状態監視、Orient＝追跡・変化点・見張り、Decide＝承認線 v と承認、Act＝短期リース・代替運航。月次の見直しは PDCA の Check → Act と OODA の Decide を一つの板でつなぐ。</text><rect x="20" y="1396" width="52" height="16" rx="4" fill="#475569"/><text x="46" y="1408" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">O→PDCA</text><text x="80" y="1408" font-size="11.5" fill="#0f172a">OODA の出力が PDCA の入力：ここで観測し整えたもの（→ P1 の札）は年 1 回の版で ① 前提と ② 世界の入力になる。逆に PDCA の Plan（基準計画）が Orient の入力。二つの輪は互いの入力。</text><rect x="20" y="1414" width="52" height="16" rx="4" fill="#0e7490"/><text x="46" y="1426" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">P1 接続</text><text x="80" y="1426" font-size="11.5" fill="#0f172a">基本計画（年次〜半期）との受け渡し。基準計画を受け取り、学習と見張りの結果を返す。乱数の種 5 つで AOG ±1pt。すべて合成データの目安。</text><rect x="519.0" y="134.0" width="857.0" height="90.0" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><rect x="519.0" y="328.0" width="283.0" height="174.0" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><rect x="519.0" y="522.0" width="283.0" height="90.0" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><rect x="806.0" y="328.0" width="283.0" height="284.0" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><rect x="1093.0" y="328.0" width="283.0" height="284.0" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><polyline fill="none" points="507.0,172.0 513.0,172.0 513.0,172.0 527.0,172.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,366.0 513.0,366.0 513.0,366.0 527.0,366.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="660.5,396.0 660.5,420.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="814.0,366.0 808.0,366.0 808.0,366.0 794.0,366.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="947.5,530.0 947.5,396.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="1081.0,754.0 1087.0,754.0 1087.0,366.0 1101.0,366.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="794.0,366.0 800.0,366.0 800.0,366.0 1101.0,366.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="660.5,336.0 660.5,202.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,560.0 513.0,560.0 513.0,560.0 527.0,560.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="660.5,724.0 660.5,590.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,838.0 513.0,838.0 513.0,754.0 527.0,754.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,754.0 513.0,754.0 513.0,754.0 527.0,754.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,948.0 513.0,948.0 513.0,450.0 527.0,450.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="660.5,918.0 660.5,480.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,1142.0 513.0,1142.0 513.0,1142.0 527.0,1142.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="660.5,590.0 660.5,1112.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="794.0,172.0 800.0,172.0 800.0,172.0 1101.0,172.0" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="794.0,560.0 800.0,560.0 800.0,560.0 1101.0,560.0" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="1234.5,336.0 1234.5,202.0" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="593.75,224.0 593.75,328.0" stroke="#be123c" stroke-width="2.6" marker-end="url(#ar)"/><rect x="240.0" y="142.0" width="267.0" height="60" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="249.0" y="159.0" font-size="12" font-weight="700" fill="#0f172a">月次の判断材料（fact pack）</text><text x="249.0" y="176.0" font-size="10.5" fill="#0f172a">入場・遅れ・所見・故障・費用の実績を集める</text><text x="249.0" y="192.0" font-size="10.5" fill="#64748b">Secretary.io が会議前に整える</text><rect x="527.0" y="142.0" width="267.0" height="60" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="536.0" y="159.0" font-size="12" font-weight="700" fill="#0f172a">PDCA／OODA の見直し（review）</text><text x="536.0" y="176.0" font-size="10.5" fill="#0f172a">症状表 → 段階（P/D/C/A・O/O/D/A）に振り分け</text><text x="536.0" y="192.0" font-size="10.5" fill="#64748b">前提の見直し期限が来ていれば知らせる</text><rect x="1101.0" y="142.0" width="267.0" height="60" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="1110.0" y="159.0" font-size="12" font-weight="700" fill="#0f172a">承認（判断ルーム）</text><text x="1110.0" y="176.0" font-size="10.5" fill="#0f172a">承認／保留／差し戻し。承認線 v を超えた提案だけ</text><text x="1110.0" y="192.0" font-size="10.5" fill="#64748b">計算なし</text><rect x="240.0" y="336.0" width="267.0" height="60" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="249.0" y="353.0" font-size="12" font-weight="700" fill="#0f172a">計画との差（planned vs actual）</text><text x="249.0" y="370.0" font-size="10.5" fill="#0f172a">入場月・整備範囲・費用の差分</text><text x="249.0" y="386.0" font-size="10.5" fill="#64748b">差が続けば追跡の重みに効く</text><rect x="527.0" y="336.0" width="267.0" height="60" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="536.0" y="353.0" font-size="12" font-weight="700" fill="#0f172a">追跡・確率の更新（track）</text><text x="536.0" y="370.0" font-size="10.5" fill="#0f172a">1. 世界 5 の事後確率を更新（γ=0.5 で緩める）</text><text x="536.0" y="386.0" font-size="10.5" fill="#64748b">2. ΔV を出し 3. ヒステリシス K=300 k$／2 か月</text><rect x="527.0" y="420.0" width="267.0" height="60" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="536.0" y="437.0" font-size="12" font-weight="700" fill="#0f172a">次の版への学習（roll）</text><text x="536.0" y="454.0" font-size="10.5" fill="#0f172a">実績の重み n/(n+K)。変化点なら古い分を捨てる</text><text x="536.0" y="470.0" font-size="10.5" fill="#64748b">入場時期・計画外率・据置確率を補正</text><rect x="814.0" y="336.0" width="267.0" height="60" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="823.0" y="353.0" font-size="12" font-weight="700" fill="#0f172a">変化点検知（cpd）</text><text x="823.0" y="370.0" font-size="10.5" fill="#0f172a">BOCPD・CUSUM で納期回答の流れを見張る</text><text x="823.0" y="386.0" font-size="10.5" fill="#64748b">検知したら「観測世界」を足す</text><rect x="1101.0" y="336.0" width="267.0" height="60" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="1110.0" y="353.0" font-size="12" font-weight="700" fill="#0f172a">暗黙のルール（ooda）</text><text x="1110.0" y="370.0" font-size="10.5" fill="#0f172a">承認線 v・警報・戻り遅れ。その場で判断</text><text x="1110.0" y="386.0" font-size="10.5" fill="#64748b">毎日、計算なし</text><rect x="240.0" y="530.0" width="267.0" height="60" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="249.0" y="547.0" font-size="12" font-weight="700" fill="#0f172a">短期リースの条件</text><text x="249.0" y="564.0" font-size="10.5" fill="#0f172a">価格・上限・納期（仮定）</text><text x="249.0" y="580.0" font-size="10.5" fill="#64748b">見張りの手当ての単価</text><rect x="527.0" y="530.0" width="267.0" height="60" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="536.0" y="547.0" font-size="12" font-weight="700" fill="#0f172a">不足の見張り（shortage）</text><text x="536.0" y="564.0" font-size="10.5" fill="#0f172a">在庫機の遅れ・予定入場・故障を 6 か月先まで引く</text><text x="536.0" y="580.0" font-size="10.5" fill="#64748b">3 か月先 AOG > 5% → 短期リース → P1 の輪へ</text><rect x="814.0" y="530.0" width="267.0" height="60" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="823.0" y="547.0" font-size="12" font-weight="700" fill="#0f172a">キット納期の回答ログ</text><text x="823.0" y="564.0" font-size="10.5" fill="#0f172a">工場・部品の回答を週次で記録</text><text x="823.0" y="580.0" font-size="10.5" fill="#64748b">変化点の入力</text><rect x="1101.0" y="530.0" width="267.0" height="60" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="1110.0" y="547.0" font-size="12" font-weight="700" fill="#0f172a">短期リース・代替運航</text><text x="1110.0" y="564.0" font-size="10.5" fill="#0f172a">ルールで当日。上限まで積む</text><text x="1110.0" y="580.0" font-size="10.5" fill="#64748b">それでも足りなければ欠航</text><rect x="240.0" y="724.0" width="267.0" he
