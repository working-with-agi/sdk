<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>body{margin:0;background:#fbfbfd}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1330" width="1400" height="1330" font-family="IBM Plex Sans JP, sans-serif"><rect width="1400" height="1330" fill="#fbfbfd"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#be123c"/></marker></defs><rect x="20" y="16" width="85.91999999999999" height="24" rx="6" fill="#4338ca"/><text x="62.959999999999994" y="33" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P1 基本計画</text><text x="113.91999999999999" y="35" font-size="21" font-weight="700" fill="#0f172a">基本計画：年に 1 回、20 年先まで見て版を作る（年次〜半期）</text><text x="20" y="60" font-size="12" fill="#64748b">左から右へ：前提を作る → 基本計画を解く → 打ち手と購入を決める → 半期で確かめる。藍＝確率計画・モンテカルロ、青緑＝決定論・式、琥珀＝判定。深紅の枠＝繰り返し（タブに回数と条件）、藍の点線枠＝内側の 1 回。青緑の札＝詳細計画（P2）との接続。</text><rect x="232.0" y="82" width="283.0" height="30" rx="6" fill="#1e293b"/><text x="375.5" y="102" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">① 前提を作る（年 1 回）</text><rect x="519.0" y="82" width="283.0" height="30" rx="6" fill="#1e293b"/><text x="662.5" y="102" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">② 基本計画を解く（年 1 回・約 4 分）</text><rect x="806.0" y="82" width="283.0" height="30" rx="6" fill="#1e293b"/><text x="949.5" y="102" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">③ 打ち手と購入（年 1 回・約 1 分）</text><rect x="1093.0" y="82" width="283.0" height="30" rx="6" fill="#1e293b"/><text x="1236.5" y="102" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">④ 半期・四半期で確かめる</text><rect x="20" y="118.0" width="1360" height="176.66666666666666" fill="#ffffff" stroke="#e2e8f0"/><text x="30" y="208.33333333333331" font-size="12" font-weight="700" fill="#0f172a">経営（承認・投資）</text><rect x="20" y="298.66666666666663" width="1360" height="176.66666666666666" fill="#f1f3f8" stroke="#e2e8f0"/><text x="30" y="388.99999999999994" font-size="12" font-weight="700" fill="#0f172a">整備計画（計画・追跡）</text><rect x="20" y="479.3333333333333" width="1360" height="176.66666666666666" fill="#ffffff" stroke="#e2e8f0"/><text x="30" y="569.6666666666666" font-size="12" font-weight="700" fill="#0f172a">調達・契約（工場・部品・購入）</text><rect x="20" y="660.0" width="1360" height="176.66666666666666" fill="#f1f3f8" stroke="#e2e8f0"/><text x="30" y="750.3333333333334" font-size="12" font-weight="700" fill="#0f172a">運航・機材（便の計画・退役）</text><rect x="20" y="840.6666666666666" width="1360" height="176.66666666666666" fill="#ffffff" stroke="#e2e8f0"/><text x="30" y="931.0" font-size="12" font-weight="700" fill="#0f172a">技術（状態・劣化）</text><rect x="20" y="1021.3333333333333" width="1360" height="176.66666666666666" fill="#f1f3f8" stroke="#e2e8f0"/><text x="30" y="1111.6666666666665" font-size="12" font-weight="700" fill="#0f172a">財務（予算・税・資産）</text><rect x="20" y="1212" width="52" height="16" rx="4" fill="#4338ca"/><text x="46" y="1224" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">内側</text><text x="80" y="1224" font-size="11.5" fill="#0f172a">解いて叩く 1 回：MILP 40 本を同時に解き、その計画を MC 800 本 × 24 か月で叩く。世界 2 つ分を確率で混ぜる。約 1.5 秒。</text><rect x="20" y="1230" width="52" height="16" rx="4" fill="#be123c"/><text x="46" y="1242" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">A</text><text x="80" y="1242" font-size="11.5" fill="#0f172a">購入の輪：候補 4 つそれぞれで内側を回し、AOG 1 点あたり最も安い手を 1 つ足す。5% を切るまで 4 回 ＝ 内側 32 回・約 50 秒。</text><rect x="20" y="1248" width="52" height="16" rx="4" fill="#be123c"/><text x="46" y="1260" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">D</text><text x="80" y="1260" font-size="11.5" fill="#0f172a">需要の見直し：年 1 回。過去の伸び（短期／長期）の差が 3pt を超えたら随時。前提が変わるので基本計画を解き直す。</text><rect x="20" y="1266" width="52" height="16" rx="4" fill="#1e293b"/><text x="46" y="1278" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">年次の版</text><text x="80" y="1278" font-size="11.5" fill="#0f172a">世界 5 × 内側 ＝ 約 4 分。版ごとに 過去で検証 の補正（入場時期・計画外率・据置確率）を入れてから解く。</text><rect x="20" y="1284" width="52" height="16" rx="4" fill="#0e7490"/><text x="46" y="1296" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">P2 接続</text><text x="80" y="1296" font-size="11.5" fill="#0f172a">詳細計画（月次〜当日）との受け渡し。基準計画は追跡へ渡り、学習と見張りの結果がここへ戻る。すべて合成データの目安。</text><rect x="521.0" y="304.66666666666663" width="279.0" height="170.0" rx="10" fill="rgba(67,56,202,0.08)" stroke="#4338ca" stroke-width="2" stroke-dasharray="2 2"/><rect x="519.0" y="483.3333333333333" width="283.0" height="89.99999999999994" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><rect x="232.0" y="664.0" width="283.0" height="174.0" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><polyline fill="none" points="507.0,340.66666666666663 513.0,340.66666666666663 513.0,340.66666666666663 527.0,340.66666666666663" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,786.0 513.0,786.0 513.0,702.0 527.0,702.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="660.5,672.0 660.5,454.66666666666663" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,882.6666666666666 513.0,882.6666666666666 513.0,424.66666666666663 527.0,424.66666666666663" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,521.3333333333333 513.0,521.3333333333333 513.0,521.3333333333333 527.0,521.3333333333333" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,966.6666666666666 513.0,966.6666666666666 513.0,340.66666666666663 1101.0,340.66666666666663" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="794.0,424.66666666666663 800.0,424.66666666666663 800.0,340.66666666666663 1101.0,340.66666666666663" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="794.0,424.66666666666663 800.0,424.66666666666663 800.0,424.66666666666663 1101.0,424.66666666666663" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="794.0,424.66666666666663 800.0,424.66666666666663 800.0,521.3333333333333 814.0,521.3333333333333" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="947.5,551.3333333333333 947.5,575.3333333333333" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="794.0,521.3333333333333 800.0,521.3333333333333 800.0,160.0 814.0,160.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="1234.5,370.66666666666663 1234.5,672.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="660.5,454.66666666666663 660.5,1033.3333333333333" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,1063.3333333333333 513.0,1063.3333333333333 513.0,1063.3333333333333 527.0,1063.3333333333333" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,1147.3333333333333 513.0,1147.3333333333333 513.0,1063.3333333333333 527.0,1063.3333333333333" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="947.5,214.0 947.5,190.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="1101.0,521.3333333333333 1095.0,521.3333333333333 1095.0,521.3333333333333 794.0,521.3333333333333" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="947.5,491.3333333333333 947.5,274.0" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="519.0,536.3333333333333 507.0,536.3333333333333 507.0,389.66666666666663 521.0,389.66666666666663" stroke="#be123c" stroke-width="2.6" marker-end="url(#ar)"/><text x="501.0" y="462.99999999999994" font-size="11" font-weight="700" fill="#be123c" text-anchor="middle" transform="rotate(-90 501.0 462.99999999999994)">A：次の手へ</text><rect x="814.0" y="130.0" width="267.0" height="60" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="823.0" y="147.0" font-size="12" font-weight="700" fill="#0f172a">版の承認（判断ルーム）</text><text x="823.0" y="164.0" font-size="10.5" fill="#0f172a">承認／保留／差し戻し。計算なし</text><text x="823.0" y="180.0" font-size="10.5" fill="#64748b">p10〜p90 と欠航確率を見て決める</text><rect x="814.0" y="214.0" width="267.0" height="60" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="823.0" y="231.0" font-size="12" font-weight="700" fill="#0f172a">国内工場の新設・段階投資（invest）</text><text x="823.0" y="248.0" font-size="10.5" fill="#0f172a">3 案を NPV と実物オプションで比べる</text><text x="823.0" y="264.0" font-size="10.5" fill="#64748b">案ごとに基本計画を解いて叩く</text><rect x="240.0" y="310.66666666666663" width="267.0" height="60" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="249.0" y="327.66666666666663" font-size="12" font-weight="700" fill="#0f172a">20 年の履歴（lifecycle）</text><text x="249.0" y="344.66666666666663" font-size="10.5" fill="#0f172a">240 か月を全エンジンで回し、最初の 5 年は捨てる</text><text x="249.0" y="360.66666666666663" font-size="10.5" fill="#64748b">平年値と、今日の機材状態（残り時間・部品）</text><rect x="527.0" y="310.66666666666663" width="267.0" height="60" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="536.0" y="327.66666666666663" font-size="12" font-weight="700" fill="#0f172a">世界と重み（基準・逼迫・…）</text><text x="536.0" y="344.66666666666663" font-size="10.5" fill="#0f172a">世界 5 つ。追跡の事後確率で重みづけ</text><text x="536.0" y="360.66666666666663" font-size="10.5" fill="#64748b">逼迫＝キット納期 12 か月・手持ち半減</text><rect x="527.0" y="394.66666666666663" width="267.0" height="60" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="536.0" y="411.66666666666663" font-size="12" font-weight="700" fill="#0f172a">基準計画の凍結（baseline）</text><text x="536.0" y="428.66666666666663" font-size="10.5" fill="#0f172a">解く：MILP 40 本のシナリオを同時に見て 1 計画</text><text x="536.0" y="444.66666666666663" font-size="10.5" fill="#64748b">叩く：その計画を MC 800 本 × 24 か月で評価</text><rect x="1101.0" y="310.66666666666663" width="267.0" height="60" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="1110.0" y="327.66666666666663" font-size="12" font-weight="700" fill="#0f172a">退役までの入場列（runout）</text><text x="1110.0" y="344.66666666666663" font-size="10.5" fill="#0f172a">決定論。退役順 3 通り（期限順・古い順・乱数）</text><text x="1110.0" y="360.66666666666663" font-size="10.5" fill="#64748b">空の年が出る理由（退役が入場を吸う）を注釈</text><rect x="1101.0" y="394.66666666666663" width="267.0" height="60" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="1110.0" y="411.66666666666663" font-size="12" font-weight="700" fill="#0f172a">過去で検証（backtest）</text><text x="1110.0" y="428.66666666666663" font-size="10.5" fill="#0f172a">8 版を過去に当て、学ぶ 5 版／確かめる 5 版</text><text x="1110.0" y="444.66666666666663" font-size="10.5" fill="#64748b">入場時期 +1.5 か月、被覆率 78%（合成）</text><rect x="240.0" y="491.3333333333333" width="267.0" height="60" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="249.0" y="508.3333333333333" font-size="12" font-weight="700" fill="#0f172a">見積・契約の条件</text><text x="249.0" y="525.3333333333333" font-size="10.5" fill="#0f172a">工場ごとの価格・TAT・所見折半・キット納期</text><text x="249.0" y="541.3333333333333" font-size="10.5" fill="#64748b">Knowledge Hub から取り込む</text><rect x="527.0" y="491.3333
