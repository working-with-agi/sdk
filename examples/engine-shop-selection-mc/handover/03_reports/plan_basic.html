<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>body{margin:0;background:#fbfbfd}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1470" width="1400" height="1470" font-family="IBM Plex Sans JP, sans-serif"><rect width="1400" height="1470" fill="#fbfbfd"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#be123c"/></marker></defs><rect x="20" y="16" width="85.91999999999999" height="24" rx="6" fill="#4338ca"/><text x="62.959999999999994" y="33" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">P1 基本計画</text><text x="113.91999999999999" y="35" font-size="21" font-weight="700" fill="#0f172a">基本計画：年に 1 回、20 年先まで見て版を作る（年次〜半期）</text><text x="20" y="60" font-size="12" fill="#64748b">左から右へ：前提を作る → 基本計画を解く → 打ち手と購入を決める → 半期で確かめる。藍＝確率計画・モンテカルロ、青緑＝決定論・式、琥珀＝判定。深紅の枠＝繰り返し（タブに回数と条件）、藍の点線枠＝内側の 1 回。青緑の札＝詳細計画（P2）との接続。</text><rect x="232.0" y="74" width="283.0" height="46" rx="6" fill="#1e293b"/><text x="375.5" y="93" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">① 前提を作る（年 1 回）</text><rect x="337.995" y="100" width="75.01" height="16" rx="8" fill="#475569"/><text x="375.5" y="112" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="700">PDCA：Plan</text><rect x="519.0" y="74" width="283.0" height="46" rx="6" fill="#1e293b"/><text x="662.5" y="93" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">② 基本計画を解く（年 1 回・約 4 分）</text><rect x="624.995" y="100" width="75.01" height="16" rx="8" fill="#475569"/><text x="662.5" y="112" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="700">PDCA：Plan</text><rect x="806.0" y="74" width="283.0" height="46" rx="6" fill="#1e293b"/><text x="949.5" y="93" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">③ 打ち手と購入（年 1 回・約 1 分）</text><rect x="874.09" y="100" width="150.82" height="16" rx="8" fill="#475569"/><text x="949.5" y="112" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="700">PDCA：Plan → Do（承認）</text><rect x="1093.0" y="74" width="283.0" height="46" rx="6" fill="#1e293b"/><text x="1236.5" y="93" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">④ 半期・四半期で確かめる</text><rect x="1175.58" y="100" width="121.84000000000003" height="16" rx="8" fill="#475569"/><text x="1236.5" y="112" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="700">PDCA：Check → Act</text><rect x="20" y="130.0" width="1360" height="190.0" fill="#ffffff" stroke="#e2e8f0"/><text x="30" y="227.0" font-size="12" font-weight="700" fill="#0f172a">経営（承認・投資）</text><rect x="20" y="324.0" width="1360" height="190.0" fill="#f1f3f8" stroke="#e2e8f0"/><text x="30" y="421.0" font-size="12" font-weight="700" fill="#0f172a">整備計画（計画・追跡）</text><rect x="20" y="518.0" width="1360" height="190.0" fill="#ffffff" stroke="#e2e8f0"/><text x="30" y="615.0" font-size="12" font-weight="700" fill="#0f172a">調達・契約（工場・部品・購入）</text><rect x="20" y="712.0" width="1360" height="190.0" fill="#f1f3f8" stroke="#e2e8f0"/><text x="30" y="809.0" font-size="12" font-weight="700" fill="#0f172a">運航・機材（便の計画・退役）</text><rect x="20" y="906.0" width="1360" height="190.0" fill="#ffffff" stroke="#e2e8f0"/><text x="30" y="1003.0" font-size="12" font-weight="700" fill="#0f172a">技術（状態・劣化）</text><rect x="20" y="1100.0" width="1360" height="190.0" fill="#f1f3f8" stroke="#e2e8f0"/><text x="30" y="1197.0" font-size="12" font-weight="700" fill="#0f172a">財務（予算・税・資産）</text><rect x="20" y="1306" width="52" height="16" rx="4" fill="#4338ca"/><text x="46" y="1318" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">内側</text><text x="80" y="1318" font-size="11.5" fill="#0f172a">解いて叩く 1 回：MILP 40 本を同時に解き、その計画を MC 800 本 × 24 か月で叩く。世界 2 つ分を確率で混ぜる。約 1.5 秒。</text><rect x="20" y="1324" width="52" height="16" rx="4" fill="#be123c"/><text x="46" y="1336" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">A</text><text x="80" y="1336" font-size="11.5" fill="#0f172a">購入の輪：候補 4 つそれぞれで内側を回し、AOG 1 点あたり最も安い手を 1 つ足す。5% を切るまで 4 回 ＝ 内側 32 回・約 50 秒。</text><rect x="20" y="1342" width="52" height="16" rx="4" fill="#be123c"/><text x="46" y="1354" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">D</text><text x="80" y="1354" font-size="11.5" fill="#0f172a">需要の見直し：年 1 回。過去の伸び（短期／長期）の差が 3pt を超えたら随時。前提が変わるので基本計画を解き直す。</text><rect x="20" y="1360" width="52" height="16" rx="4" fill="#be123c"/><text x="46" y="1372" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">F</text><text x="80" y="1372" font-size="11.5" fill="#0f172a">年次の版の輪：前提 → 解く（世界 5 × 内側 ≒ 4 分）→ 打ち手と購入 → 承認。差し戻しなら前提を直して解き直す（年 1 回、差し戻しは 1〜2 回が感覚値）。</text><rect x="20" y="1378" width="52" height="16" rx="4" fill="#be123c"/><text x="46" y="1390" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">G</text><text x="80" y="1390" font-size="11.5" fill="#0f172a">半期の輪：退役までの入場列と過去での検証で版を確かめ、補正（入場時期・計画外率・据置確率）を入れて次の版へ。足す計画が「必要」を変えたら解き直す（年 2 回）。</text><rect x="20" y="1396" width="52" height="16" rx="4" fill="#475569"/><text x="46" y="1408" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">PDCA</text><text x="80" y="1408" font-size="11.5" fill="#0f172a">このページは PDCA。Plan＝前提・解く・打ち手（①〜③）、Do＝承認と実行、Check＝半期の検証（④）、Act＝補正して次の版。見直し（review）は症状をこの 4 段に振り分ける。</text><rect x="20" y="1414" width="52" height="16" rx="4" fill="#0f766e"/><text x="46" y="1426" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">OODA→P</text><text x="80" y="1426" font-size="11.5" fill="#0f172a">OODA の出力が Plan の入力：Observe（実績・回答ログ・便の実績）は ① の前提に、Orient（事後確率・変化点・補正）は ② の世界と重みに入る。青緑の札 ← P2 がその口。</text><rect x="20" y="1432" width="52" height="16" rx="4" fill="#0e7490"/><text x="46" y="1444" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">P2 接続</text><text x="80" y="1444" font-size="11.5" fill="#0f172a">詳細計画（月次〜当日）との受け渡し。基準計画は追跡へ渡り、学習と見張りの結果がここへ戻る。すべて合成データの目安。</text><rect x="521.0" y="330.0" width="279.0" height="170.0" rx="10" fill="rgba(67,56,202,0.08)" stroke="#4338ca" stroke-width="2" stroke-dasharray="2 2"/><rect x="519.0" y="522.0" width="283.0" height="90.0" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><rect x="232.0" y="716.0" width="283.0" height="174.0" rx="10" fill="rgba(190,18,60,0.06)" stroke="#be123c" stroke-width="2" stroke-dasharray="7 4"/><rect x="230" y="132" width="855.0" height="1154.0" rx="12" fill="none" stroke="#be123c" stroke-width="2.5" stroke-dasharray="10 5"/><rect x="1095.0" y="326.0" width="279.0" height="572.0" rx="12" fill="none" stroke="#be123c" stroke-width="2.5" stroke-dasharray="10 5"/><polyline fill="none" points="507.0,366.0 513.0,366.0 513.0,366.0 527.0,366.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,838.0 513.0,838.0 513.0,754.0 527.0,754.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="660.5,724.0 660.5,480.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,948.0 513.0,948.0 513.0,450.0 527.0,450.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,560.0 513.0,560.0 513.0,560.0 527.0,560.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,1032.0 513.0,1032.0 513.0,366.0 1101.0,366.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="794.0,450.0 800.0,450.0 800.0,366.0 1101.0,366.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="794.0,450.0 800.0,450.0 800.0,450.0 1101.0,450.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="794.0,450.0 800.0,450.0 800.0,560.0 814.0,560.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="947.5,590.0 947.5,614.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="1234.5,396.0 1234.5,724.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="660.5,480.0 660.5,1112.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,1142.0 513.0,1142.0 513.0,1142.0 527.0,1142.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="507.0,1226.0 513.0,1226.0 513.0,1142.0 527.0,1142.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="947.5,226.0 947.5,202.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="1101.0,560.0 1095.0,560.0 1095.0,560.0 794.0,560.0" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="947.5,530.0 947.5,286.0" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" opacity=".85"/><polyline fill="none" points="519.0,575.0 507.0,575.0 507.0,415.0 521.0,415.0" stroke="#be123c" stroke-width="2.6" marker-end="url(#ar)"/><text x="501.0" y="495.0" font-size="11" font-weight="700" fill="#be123c" text-anchor="middle" transform="rotate(-90 501.0 495.0)">A：次の手へ</text><polyline fill="none" points="814.0,190.0 800.0,190.0 800.0,468.0 800.0,468.0" stroke="#be123c" stroke-width="2.6" marker-end="url(#ar)"/><text x="810.0" y="366.0" font-size="11" font-weight="700" fill="#be123c" text-anchor="middle" transform="rotate(-90 810.0 366.0)">F：差し戻し → 解き直す</text><polyline fill="none" points="1101.0,468.0 1063.0,468.0 1063.0,384.0 800.0,384.0" stroke="#be123c" stroke-width="2.6" marker-end="url(#ar)"/><text x="931.5" y="378.0" font-size="11" font-weight="700" fill="#be123c" text-anchor="middle">G：補正を入れて次の版</text><polyline fill="none" points="1101.0,772.0 794.0,772.0" stroke="#be123c" stroke-width="2.6" marker-end="url(#ar)"/><text x="947.5" y="766.0" font-size="11" font-weight="700" fill="#be123c" text-anchor="middle">G：足す計画が「必要」を変えたら解き直す</text><rect x="814.0" y="142.0" width="267.0" height="60" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="823.0" y="159.0" font-size="12" font-weight="700" fill="#0f172a">版の承認（判断ルーム）</text><text x="823.0" y="176.0" font-size="10.5" fill="#0f172a">購入計画・打ち手・投資案を見て決める</text><text x="823.0" y="192.0" font-size="10.5" fill="#64748b">承認／保留／差し戻し。計算なし</text><rect x="814.0" y="226.0" width="267.0" height="60" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="823.0" y="243.0" font-size="12" font-weight="700" fill="#0f172a">国内工場の新設・段階投資（invest）</text><text x="823.0" y="260.0" font-size="10.5" fill="#0f172a">3 案を NPV と実物オプションで比べる</text><text x="823.0" y="276.0" font-size="10.5" fill="#64748b">案ごとに基本計画を解いて叩く</text><rect x="240.0" y="336.0" width="267.0" height="60" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="249.0" y="353.0" font-size="12" font-weight="700" fill="#0f172a">20 年の履歴（lifecycle）</text><text x="249.0" y="370.0" font-size="10.5" fill="#0f172a">240 か月を全エンジンで回し、最初の 5 年は捨てる</text><text x="249.0" y="386.0" font-size="10.5" fill="#64748b">平年値と、今日の機材状態（残り時間・部品）</text><rect x="527.0" y="336.0" width="267.0" height="60" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="536.0" y="353.0" font-size="12" font-weight="700" fill="#0f172a">世界と重み（基準・逼迫・…）</text><text x="536.0" y="370.0" font-size="10.5" fill="#0f172a">世界 5 つ。追跡の事後確率で重みづけ</text><text x="536.0" y="386.0" font-size="10.5" fill="#64748b">逼迫＝キット納期 12 か月・手持ち半減</text><rect x="527.0" y="420.0" width="267.0" height="60" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="536.0" y="437.0" font-size="12" font-weight="700" fill="#0f172a">基準計画の凍結（baseline）</text><text x="536.0" y="454.0" font-size="10.5" fill="#0f172a">解く：MILP 40 本のシナリオを同時に見て 1 計画</text><text x="536.0" y="470.0" font-size="10.5" fill="#64748b">叩く：その計画を MC 800 本 × 24 か月で評価</text><rect x="1101.0" y="336.0" width="267.0" height="60" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="1110.0" y="353.0" font-size="12" font-weight="700" fill="#0f172a">退役までの入場列（runout）</text><text x="1110.0" y="370.0" font-size="10.5" fill="#0f172a">決定論。退役順 3 通り（期限順・古い順・乱数）</text><text x="1110.0" y="386.0" font-size="10.5" fill="#64748b">空の年が出る理由（退役が入場を吸う）を注釈</text><rect x="1101.0" y="420.0" width="267.0" height="60" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="1110.0" y="437.0" font-size="12" font-weight="700" fill="#0f172a">過去で検証（backtest）</text><text x="1110.0" y="454.0" font-size="10.5" fill="#0f172a">8 版を過去に当て、学ぶ 5 版／確かめる 5 版</text><text x="1110.0" y="470.0" font-size="10.5" fill="#64748b">入場時期 +1.5 か月、被覆率 78%（合成）</text><rect x="240.0" y="530.0" width="267.0" height="60" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="249.0" y="547.0" font-size="12" font-weight="700" fill="#0f172a">見積・契約の条件</text><text x="249.0" y="564.0" font-size="10.5" fill="#0f172a">工場ごとの価格・TAT・所見折半・キット納期</text><text x="249.0" y="580.0" font-size="10.5" fill="#64748b">Knowledge Hub から取り込む</text><rect x="527.0" y="530.0" width="267.0" height="60" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="536.0" y="547.0" font-size="12" font-weight="700" fill="#0f172a">購入計画の輪（purchase_loop）</text><text x="536.0" y="564.0" font-size="10.5" fill="#0f172a">候補 4（予備・購入・プール・中寿命）を順に試す</text><text x="536.0" y="580.0" font-size="10.5" fill="#64748b">欠航 1 点あたり最も安い 1 手を足す</text><rect x="814.0" y="530.0" width="267.0" height="60" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="823.0" y="547.0" font-size="12" font-weight="700" fill="#0f172a">打ち手の値付け（compare）</text><text x
