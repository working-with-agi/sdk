<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>body{margin:0;background:#f6f4ee}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1260" width="1240" height="1260" font-family="IBM Plex Sans JP, sans-serif"><rect width="1240" height="1260" fill="#f6f4ee"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b7791f"/></marker></defs><text x="20" y="36" font-size="22" fill="#141413" text-anchor="start" font-weight="700">何回もシミュレーションする内側（購入計画の輪、JAL の 1 回分）</text><text x="20" y="62" font-size="12" fill="#5b5a55" text-anchor="start" >外から内へ 5 段のループ。いちばん内側の「1 本」が 24 か月を月ごとに進める本体で、それを 800 本束ねて 1 つの数字（欠航確率・期待費用）にする。</text><rect x="20" y="80" width="1200" height="1110" rx="10" fill="#ffffff" stroke="#141413" stroke-width="2"/><text x="36" y="108" font-size="17" fill="#141413" text-anchor="start" font-weight="700">① 手のループ：機隊の構成に 1 手ずつ足す</text><text x="1204" y="108" font-size="14" fill="#141413" text-anchor="end" font-weight="700">4 回（目標 5% に届くまで）</text><text x="36" y="112" font-size="12" fill="#5b5a55" text-anchor="start" >手 0：今の機隊 → 手 1：中寿命機 +2 → 手 2：+2 → 手 3：プール +1 → 手 4：+1。各手の終わりに、下の結果から「欠航 1 点を下げるのに最も安い候補」を 1 つ採用。</text><rect x="40" y="132" width="1160" height="1040" rx="10" fill="#fbfaf6" stroke="#1f3d63" stroke-width="2"/><text x="56" y="160" font-size="17" fill="#141413" text-anchor="start" font-weight="700">② 候補のループ：足す候補を 1 つずつ試す</text><text x="1184" y="160" font-size="14" fill="#1f3d63" text-anchor="end" font-weight="700">4 候補（予備リース +1／購入 +1／プール +1／中寿命 +2）</text><text x="56" y="164" font-size="12" fill="#5b5a55" text-anchor="start" >候補ごとに「その構成で計画を作ったらどうなるか」を下で測る。試すだけで採用はしない。</text><rect x="60" y="184" width="1120" height="970" rx="10" fill="#f3f5f9" stroke="#35557f" stroke-width="2"/><text x="76" y="212" font-size="17" fill="#141413" text-anchor="start" font-weight="700">③ 世界のループ：前提を変えて同じことをする</text><text x="1164" y="212" font-size="14" fill="#35557f" text-anchor="end" font-weight="700">2 世界（基準 52%・逼迫 48% で重みづけ）</text><text x="76" y="216" font-size="12" fill="#5b5a55" text-anchor="start" >逼迫＝キット納期 12 か月・手持ち半減。世界ごとの結果を確率で混ぜて期待値にする。</text><rect x="80" y="236" width="1080" height="110" rx="10" fill="#ffffff" stroke="#2f5d3a" stroke-width="2"/><text x="96" y="264" font-size="17" fill="#141413" text-anchor="start" font-weight="700">④ 計画を解く（この構成・この世界で 1 回）</text><text x="1144" y="264" font-size="14" fill="#2f5d3a" text-anchor="end" font-weight="700">MILP：40 本のシナリオを同時に見て最適化</text><text x="96" y="278" font-size="12" fill="#141413" text-anchor="start" >決めるもの：どのエンジンを・何月に・どの整備範囲で・どの工場（中寿命機への入れ替えも含む）に出すか、予備の使い方。</text><text x="96" y="300" font-size="12" fill="#141413" text-anchor="start" >40 本のシナリオ＝遅れ・所見・故障の引き方が違う 40 通りの未来。その全部でそこそこ良い 1 つの計画を選ぶ（期待費用＋欠航の罰金を最小化）。</text><text x="96" y="322" font-size="12" fill="#5b5a55" text-anchor="start" >出てくるもの：計画 1 本（凍結すれば基準計画になるもの）。所要 1〜2 秒。</text><text x="620" y="368" font-size="16" fill="#1f3d63" text-anchor="middle">↓ その計画を、別の乱数で叩く</text><rect x="80" y="380" width="1080" height="750" rx="10" fill="#ffffff" stroke="#a23b2a" stroke-width="2"/><text x="96" y="408" font-size="17" fill="#141413" text-anchor="start" font-weight="700">⑤ 評価のループ：同じ計画を違う未来で走らせる</text><text x="1144" y="408" font-size="14" fill="#a23b2a" text-anchor="end" font-weight="700">800 本（乱数の種 42）</text><text x="96" y="420" font-size="12" fill="#5b5a55" text-anchor="start" >1 本＝下の「24 か月の時間ループ」を 1 回通すこと。800 本の結果を集めて数字にする。</text><rect x="100" y="436" width="1040" height="480" rx="10" fill="#fbfaf6" stroke="#b7791f" stroke-width="2"/><text x="116" y="464" font-size="17" fill="#141413" text-anchor="start" font-weight="700">⑥ 1 本の中身：24 か月を月ごとに進める</text><text x="1124" y="464" font-size="14" fill="#b7791f" text-anchor="end" font-weight="700">t = 0 … 23</text><rect x="120.0" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="140.83333333333334" y="488" font-size="10" fill="#141413" text-anchor="middle" >10</text><rect x="161.66666666666666" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="182.5" y="488" font-size="10" fill="#141413" text-anchor="middle" >11</text><rect x="203.33333333333331" y="470" width="39.666666666666664" height="26" fill="#f3ede2" stroke="#e5e1d6"/><text x="224.16666666666666" y="488" font-size="10" fill="#141413" text-anchor="middle" >12</text><rect x="245.0" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="265.8333333333333" y="488" font-size="10" fill="#141413" text-anchor="middle" >1</text><rect x="286.66666666666663" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="307.49999999999994" y="488" font-size="10" fill="#141413" text-anchor="middle" >2</text><rect x="328.3333333333333" y="470" width="39.666666666666664" height="26" fill="#f3ede2" stroke="#e5e1d6"/><text x="349.16666666666663" y="488" font-size="10" fill="#141413" text-anchor="middle" >3</text><rect x="370.0" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="390.8333333333333" y="488" font-size="10" fill="#141413" text-anchor="middle" >4</text><rect x="411.66666666666663" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="432.49999999999994" y="488" font-size="10" fill="#141413" text-anchor="middle" >5</text><rect x="453.3333333333333" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="474.16666666666663" y="488" font-size="10" fill="#141413" text-anchor="middle" >6</text><rect x="495.0" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="515.8333333333334" y="488" font-size="10" fill="#141413" text-anchor="middle" >7</text><rect x="536.6666666666666" y="470" width="39.666666666666664" height="26" fill="#f3ede2" stroke="#e5e1d6"/><text x="557.5" y="488" font-size="10" fill="#141413" text-anchor="middle" >8</text><rect x="578.3333333333333" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="599.1666666666666" y="488" font-size="10" fill="#141413" text-anchor="middle" >9</text><rect x="620.0" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="640.8333333333334" y="488" font-size="10" fill="#141413" text-anchor="middle" >10</text><rect x="661.6666666666666" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="682.5" y="488" font-size="10" fill="#141413" text-anchor="middle" >11</text><rect x="703.3333333333333" y="470" width="39.666666666666664" height="26" fill="#f3ede2" stroke="#e5e1d6"/><text x="724.1666666666666" y="488" font-size="10" fill="#141413" text-anchor="middle" >12</text><rect x="745.0" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="765.8333333333334" y="488" font-size="10" fill="#141413" text-anchor="middle" >1</text><rect x="786.6666666666666" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="807.5" y="488" font-size="10" fill="#141413" text-anchor="middle" >2</text><rect x="828.3333333333333" y="470" width="39.666666666666664" height="26" fill="#f3ede2" stroke="#e5e1d6"/><text x="849.1666666666666" y="488" font-size="10" fill="#141413" text-anchor="middle" >3</text><rect x="870.0" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="890.8333333333334" y="488" font-size="10" fill="#141413" text-anchor="middle" >4</text><rect x="911.6666666666666" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="932.5" y="488" font-size="10" fill="#141413" text-anchor="middle" >5</text><rect x="953.3333333333333" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="974.1666666666666" y="488" font-size="10" fill="#141413" text-anchor="middle" >6</text><rect x="995.0" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="1015.8333333333334" y="488" font-size="10" fill="#141413" text-anchor="middle" >7</text><rect x="1036.6666666666665" y="470" width="39.666666666666664" height="26" fill="#f3ede2" stroke="#e5e1d6"/><text x="1057.4999999999998" y="488" font-size="10" fill="#141413" text-anchor="middle" >8</text><rect x="1078.3333333333333" y="470" width="39.666666666666664" height="26" fill="#ffffff" stroke="#e5e1d6"/><text x="1099.1666666666665" y="488" font-size="10" fill="#141413" text-anchor="middle" >9</text><text x="120" y="516" font-size="12" fill="#141413" text-anchor="start" font-weight="700">各月にすること（1 本の中で乱数を引くのはここ）：</text><circle cx="134" cy="537" r="11" fill="#b7791f"/><text x="134" y="541" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="154" y="542" font-size="13" fill="#141413" text-anchor="start" font-weight="700">計画どおり入場する機を工場へ</text><text x="470" y="542" font-size="12" fill="#5b5a55" text-anchor="start" >（計画の月・整備範囲）</text><circle cx="134" cy="577" r="11" fill="#b7791f"/><text x="134" y="581" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="154" y="582" font-size="13" fill="#141413" text-anchor="start" font-weight="700">工場の遅れを引く</text><text x="470" y="582" font-size="12" fill="#5b5a55" text-anchor="start" >0〜3 か月：確率 40／30／20／10%</text><circle cx="134" cy="617" r="11" fill="#b7791f"/><text x="134" y="621" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="154" y="622" font-size="13" fill="#141413" text-anchor="start" font-weight="700">所見の追加費用を引く</text><text x="470" y="622" font-size="12" fill="#5b5a55" text-anchor="start" >45% の確率で平均 +20%</text><circle cx="134" cy="657" r="11" fill="#b7791f"/><text x="134" y="661" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="154" y="662" font-size="13" fill="#141413" text-anchor="start" font-weight="700">計画外の故障を引く</text><text x="470" y="662" font-size="12" fill="#5b5a55" text-anchor="start" >1 基 1 か月あたり 0.4%、工期 2〜4 か月</text><circle cx="134" cy="697" r="11" fill="#b7791f"/><text x="134" y="701" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">5</text><text x="154" y="702" font-size="13" fill="#141413" text-anchor="start" font-weight="700">戻ってくる機を稼働可能に戻す</text><text x="470" y="702" font-size="12" fill="#5b5a55" text-anchor="start" >入場月＋工期＋遅れ</text><circle cx="134" cy="737" r="11" fill="#b7791f"/><text x="134" y="741" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">6</text><text x="154" y="742" font-size="13" fill="#141413" text-anchor="start" font-weight="700">稼働可能 − 必要 − 予備 を数える</text><text x="470" y="742" font-size="12" fill="#5b5a55" text-anchor="start" >必要は便の計画から</text><circle cx="134" cy="777" r="11" fill="#b7791f"/><text x="134" y="781" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">7</text><text x="154" y="782" font-size="13" fill="#141413" text-anchor="start" font-weight="700">足りなければ手当て</text><text x="470" y="782" font-size="12" fill="#5b5a55" text-anchor="start" >短期リース（上限）→ 代替運航 → それでも足りなければ欠航</text><circle cx="134" cy="817" r="11" fill="#b7791f"/><text x="134" y="821" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">8</text><text x="154" y="822" font-size="13" fill="#141413" text-anchor="start" font-weight="700">その月の費用を足す</text><text x="470" y="822" font-size="12" fill="#5b5a55" text-anchor="start" >入場費・所見・リース・欠航の罰金</text><path d="M 1110,540 L 1110,865" stroke="#b7791f" stroke-width="2" fill="none" marker-end="url(#ah)"/><text x="1118" y="710" font-size="11" fill="#b7791f" text-anchor="start" >次の月へ</text><text x="120" y="888" font-size="12" fill="#141413" text-anchor="start" >24 か月が終わると 1 本の結果：総費用 1 つ、足りない月があったか（あり／なし）1 つ。</text><rect x="100" y="930" width="1040" height="110" rx="10" fill="#fbfaf6" stroke="#a23b2a" stroke-width="2"/><text x="116" y="958" font-size="17" fill="#141413" text-anchor="start" font-weight="700">⑦ 800 本を集計する</text><text x="1124" y="958" font-size="14" fill="#a23b2a" text-anchor="end" font-weight="700">→ 世界ごとの数字</text><text x="116" y="972" font-size="13" fill="#141413" text-anchor="start" >期待費用 ＝ 800 本の費用の平均。悪い 1 割 ＝ 上から 80 番目の費用。</text><text x="116" y="994" font-size="13" fill="#141413" text-anchor="start" >欠航確率 ＝ 「足りない月があった本」の数 ÷ 800（例：19 本なら 2.4%）。</text><text x="116" y="1016" font-size="13" fill="#141413" text-anchor="start" >立て直し費 ＝ 計画どおり分を超えた費用（遅れ・所見・リース・欠航）の平均。</text><text x="20" y="1220" font-size="12" fill="#141413" text-anchor="start" font-weight="700">回数の目安（JAL の 1 回分）：手 4 × 候補 4 × 世界 2 ≒ 32 回の「解く」＋ 32 × 800 ≒ 25,600 本の「1 本」＋ 各本 24 か月 ≒ 61 万か月分の月ループ。約 50 秒。</text><text x="20" y="1244" font-size="12" fill="#a23b2a" text-anchor="start" >乱数の種は 1 つ（42）。種を 5 つに変えると欠航確率は ±1pt 揺れる。</text></svg></body></html>
