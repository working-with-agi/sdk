<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>図：あるべき分析ストラテジー（層と束ね方、文献の位置）</title><style>body{margin:0;background:#fbfbfd}svg{display:block;max-width:100%;height:auto}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" role="img" aria-label="あるべき分析ストラテジー" font-family="IBM Plex Sans JP, sans-serif"><rect width="1200" height="1010" fill="#fbfbfd"/><defs><marker id="sa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker><marker id="sr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#be123c"/></marker></defs><text x="20" y="30" text-anchor="start" style="fill:#0f172a;font-size:20px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">あるべき分析ストラテジー：層ごとの方法と束ね方（文献の位置つき）</text><text x="20" y="52" text-anchor="start"  style="fill:#64748b;font-size:11px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">下から上へ観測が流れ、上から下へ決定が流れる。太い深紅の矢印＝推奨する経路。各箱の 3 行目＝その方法が語られている文献の系統。深紅の枠＝この設計で新しく足す層。</text><rect x="20" y="66" width="1160" height="120" rx="10" fill="#f1f3f8" stroke="#e2e8f0"/><text x="32" y="84" text-anchor="start" style="fill:#0f172a;font-size:12.5px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">① 上の層</text><text x="32" y="100" text-anchor="start"  style="fill:#64748b;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">需要と機材｜年 1 回</text><rect x="240" y="78" width="280" height="96" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="249" y="95" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">需要の前提（伸び・季節・稼働）</text><text x="249" y="111" text-anchor="start"  style="fill:#0f172a;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">直近と長期を地平で混ぜる。3pt で随時</text><text x="249" y="166" text-anchor="start"  style="fill:#64748b;font-size:9.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">予測結合：Timmermann 2006</text><rect x="540" y="78" width="280" height="96" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="549" y="95" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">機材計画 → 必要エンジン数</text><text x="549" y="111" text-anchor="start"  style="fill:#0f172a;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">便の計画が「必要」を決める。足す計画は半期</text><text x="549" y="166" text-anchor="start"  style="fill:#64748b;font-size:9.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">機材計画のポートフォリオ：Omega 2019 頃（B）</text><rect x="840" y="78" width="300" height="96" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="849" y="95" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">決定：版の承認・購入・便・投資</text><text x="849" y="111" text-anchor="start"  style="fill:#0f172a;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">経営が決める。計算は材料を渡すだけ</text><text x="849" y="166" text-anchor="start"  style="fill:#64748b;font-size:9.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">RDM：Lempert ほか 2003</text><rect x="20" y="196" width="1160" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="32" y="214" text-anchor="start" style="fill:#0f172a;font-size:12.5px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">② 機隊の計画</text><text x="32" y="230" text-anchor="start"  style="fill:#64748b;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">確率計画と購入の輪｜年 1 回・随時</text><rect x="240" y="208" width="280" height="126" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="249" y="225" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">内側：解いて叩く</text><text x="249" y="241" text-anchor="start"  style="fill:#0f172a; ：Kolter & Maloof 2007</text><rect x="240" y="608" width="280" height="62" rx="7" fill="#e0e7ff" stroke="#be123c" stroke-width="2.5"/><text x="249" y="625" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">混成（推奨）</text><text x="249" y="641" text-anchor="start"  style="fill:#0f172a;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">平均を既定に、ゆっくり忘れ、検知で切る</text><text x="249" y="662" text-anchor="start"  style="fill:#64748b;font-size:9.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">Gama ほか 2014（検知型＋窓型）</text><rect x="540" y="398" width="280" height="90" rx="7" fill="#e0e7ff" stroke="#be123c" stroke-width="2.5"/><text x="549" y="415" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">束ね方 ① 等重み平均（既定）</text><text x="549" y="431" text-anchor="start"  style="fill:#0f172a;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">4 つの世界の確率・補正・伸びを等しく平均</text><text x="549" y="480" text-anchor="start"  style="fill:#64748b;font-size:9.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">予測結合のパズル：Bates & Granger 1969</text><rect x="540" y="498" width="280" height="90" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="549" y="515" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">束ね方 ② 採点重み（年 1 回）</text><text x="549" y="531" text-anchor="start"  style="fill:#0f172a;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">過去での検証の点数で重み。年 1 回だけ更新</text><text x="549" y="580" text-anchor="start"  style="fill:#64748b;font-size:9.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">スタッキング：Yao ほか 2018／BPS 2019</text><rect x="540" y="598" width="280" height="78" rx="7" fill="#fef3c7" stroke="#be123c" stroke-width="2.5"/><text x="549" y="615" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">束ね方 ③ 幅を信号に</text><text x="549" y="631" text-anchor="start"  style="fill:#0f172a;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">4 つの答えの幅が広い月 → 見直しの引き金</text><text x="549" y="668" text-anchor="start"  style="fill:#64748b;font-size:9.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">spread–skill：Leutbecher & Palmer 2008</text><rect x="840" y="398" width="300" height="90" rx="7" fill="#d1fae5" stroke="#be123c" stroke-width="2.5"/><text x="849" y="415" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">束ねた前提（世界の確率・補正・伸び）</text><text x="849" y="431" text-anchor="start"  style="fill:#0f172a;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">→ 内側へ。表紙に「束ね方」を記す</text><rect x="840" y="498" width="300" height="90" rx="7" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="849" y="515" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">過去での検証：4 つを採点</text><text x="849" y="531" text-anchor="start"  style="fill:#0f172a;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">学ぶ 5 版／確かめる 5 版。被覆率・時期・需要</text><text x="849" y="580" text-anchor="start"  style="fill:#64748b;font-size:9.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">交差検証に相当（backtest.py）</text><rect x="840" y="598" width="300" height="78" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="849" y="615" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">見直し（月次会議）</text><text x="849" y="631" text-anchor="start"  style="fill:#0f172a;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">幅が広い・変化点・引き金 → Check → Act</text><text x="849" y="668" text-anchor="start"  style="fill:#64748b;font-size:9.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">review.py（規則層＋AI 層）</text><rect x="20" y="716" width="1160" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="32" y="734" text-anchor="start" style="fill:#0f172a;font-size:12.5px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">④ 観測</text><text x="32" y="750" text-anchor="start"  style="fill:#64748b;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">部品の寿命と実績｜便ごと〜月次</text><rect x="240" y="728" width="280" height="126" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="249" y="745" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">状態監視と RUL（残り寿命）</text><text x="249" y="761" text-anchor="start"  style="fill:#0f172a;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">EGT・LLP。複数モデルを束ねて誤差を 1〜2 割下げる</text><text x="249" y="846" text-anchor="start"  style="fill:#64748b;font-size:9.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">RUL のアンサンブル：Sci. Rep. 2025／JAIS</text><rect x="540" y="728" width="280" height="126" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="549" y="745" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">実績（入場・遅れ・所見・故障・費用）</text><text x="549" y="761" text-anchor="start"  style="fill:#0f172a;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">計画との差。Secretary.io が会議前に整える</text><text x="549" y="846" text-anchor="start"  style="fill:#64748b;font-size:9.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">取り込み（データ）。シミュレーションではない</text><rect x="840" y="728" width="300" height="126" rx="7" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/><text x="849" y="745" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">回答ログ・便の実績・納期回答</text><text x="849" y="761" text-anchor="start"  style="fill:#0f172a;font-size:10.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">週次の先行指標、必要エンジン数の再計算</text><text x="849" y="846" text-anchor="start"  style="fill:#64748b;font-size:9.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">変化点検知の入力（cpd.py）</text><line x1="380" y1="728" x2="380" y2="686" stroke="#be123c" stroke-width="3"  marker-end="url(#sr)"/><line x1="680" y1="728" x2="680" y2="686" stroke="#be123c" stroke-width="3"  marker-end="url(#sr)"/><line x1="990" y1="728" x2="990" y2="686" stroke="#334155" stroke-width="1.8"  marker-end="url(#sa)"/><line x1="520" y1="452" x2="540" y2="452" stroke="#be123c" stroke-width="3"  marker-end="url(#sr)"/><line x1="520" y1="637" x2="540" y2="637" stroke="#be123c" stroke-width="3"  marker-end="url(#sr)"/><line x1="820" y1="443" x2="840" y2="443" stroke="#be123c" stroke-width="3"  marker-end="url(#sr)"/><line x1="840" y1="543" x2="820" y2="543" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#sa)"/><line x1="820" y1="637" x2="840" y2="637" stroke="#be123c" stroke-width="3"  marker-end="url(#sr)"/><polyline fill="none" points="990,398 990,356 380,356 380,336" stroke="#be123c" stroke-width="3"  marker-end="url(#sr)"/><line x1="520" y1="271" x2="540" y2="271" stroke="#be123c" stroke-width="3"  marker-end="url(#sr)"/><polyline fill="none" points="740,208 740,190 900,190 900,176" stroke="#be123c" stroke-width="3"  marker-end="url(#sr)"/><line x1="380" y1="176" x2="380" y2="206" stroke="#334155" stroke-width="1.8"  marker-end="url(#sa)"/><line x1="680" y1="176" x2="680" y2="206" stroke="#334155" stroke-width="1.8"  marker-end="url(#sa)"/><line x1="1060" y1="176" x2="1060" y2="206" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#sa)"/><text x="20" y="884" text-anchor="start" style="fill:#0f172a;font-size:12px;font-weight:700;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">推奨経路（太い深紅）：観測 → 4 ストラテジーを同時に回す → ① 等重み平均で束ねた前提（③ の幅は見直しへ）→ 内側で解いて叩く → 購入の輪は後悔最小で手を絞る → 決定。</text><text x="20" y="904" text-anchor="start"  style="fill:#0f172a;font-size:11.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">② 採点重みは年 1 回、過去での検証（スタッキングの交差検証に相当）で決める（点線）。月次では重みを動かさない：推定誤差を避ける（予測結合のパズル）。</text><text x="20" y="924" text-anchor="start"  style="fill:#0f172a;font-size:11.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">層と文献：④ RUL のアンサンブルは部品層、② 確率計画（SDDP）は機隊層、予備は在庫理論、工場は容量計画。③ の「学習の型を束ねる」層は当たった範囲で論文がなく、ここが新規。</text><text x="20" y="944" text-anchor="start"  style="fill:#64748b;font-size:11.5px;font-family:IBM Plex Sans JP,Noto Sans JP,sans-serif">上下の流れ：観測は下から上へ、決定は上から下へ（機材計画 → 必要エンジン数 → 内側、決定 → 工場の約束・中古市場）。すべて合成データの目安。文献の年・掲載誌は確認済み、細部は要再確認。</text></svg></body></html>
